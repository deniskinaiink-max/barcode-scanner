<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <title>Стройцентр Инком — Проверка товара</title>

  <style>
    :root {
      color-scheme: light dark;

      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #171717;
      --secondary: #777777;
      --border: #e5e5e5;
      --input: #ffffff;
      --button: #171717;
      --button-text: #ffffff;
      --accent: #007aff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --card: #1c1c1e;
        --text: #f5f5f7;
        --secondary: #a1a1a6;
        --border: #333336;
        --input: #1c1c1e;
        --button: #ffffff;
        --button-text: #111111;
        --accent: #0a84ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding:
        20px
        16px
        calc(24px + env(safe-area-inset-bottom));
    }

    .header {
      margin-bottom: 20px;
    }

    .company {
      font-size: 14px;
      color: var(--secondary);
      margin-bottom: 4px;
    }

    h1 {
      font-size: 27px;
      line-height: 1.15;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    #searchInput {
      width: 100%;
      height: 56px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--input);
      color: var(--text);
      font-size: 17px;
      outline: none;
      -webkit-appearance: none;
    }

    #searchInput:focus {
      border-color: var(--accent);
    }

    #searchInput::placeholder {
      color: var(--secondary);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      height: 52px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .camera-button {
      background: var(--button);
      color: var(--button-text);
      margin-bottom: 12px;
    }

    .update-button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 14px;
    }

    .camera-wrapper {
      display: none;
      margin-top: 8px;
      margin-bottom: 16px;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
    }

    #reader {
      width: 100%;
    }

    .close-camera {
      margin-top: 8px;
      background: #333;
      color: #fff;
    }

    .status {
      margin: 14px 0;
      text-align: center;
      color: var(--secondary);
      font-size: 14px;
      min-height: 20px;
    }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      margin-top: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .product-name {
      font-size: 21px;
      line-height: 1.25;
      font-weight: 650;
      margin-bottom: 18px;
    }

    .product-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 15px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }

    .product-row span {
      color: var(--secondary);
      font-size: 14px;
      flex-shrink: 0;
    }

    .product-row strong {
      text-align: right;
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
    }

    .stock-main {
      margin-top: 4px;
      padding: 15px 0 10px;
    }

    .stock-main span {
      font-size: 15px;
    }

    .stock-main strong {
      font-size: 25px;
      font-weight: 700;
    }

    .stock-total span,
    .stock-total strong {
      font-size: 13px;
    }

    .price {
      margin-top: 4px;
      padding-top: 15px;
    }

    .price strong {
      font-size: 22px;
      font-weight: 700;
    }

    .meta {
      margin-top: 16px;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .next-scan {
      margin-top: 16px;
      background: var(--accent);
      color: white;
    }

    .search-result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-top: 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .search-result-name {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .search-result-info {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--secondary);
      font-size: 13px;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: var(--secondary);
      font-size: 15px;
    }

    .footer {
      text-align: center;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 24px;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="company">Стройцентр Инком</div>
    <h1>Проверка товара</h1>
  </div>

  <div class="search-box">
    <input
      id="searchInput"
      type="search"
      inputmode="search"
      autocomplete="off"
      placeholder="Штрихкод, код 1С или название"
    >
  </div>

  <button
    id="cameraButton"
    class="camera-button"
    onclick="openCamera()"
  >
    📷 Сканировать штрихкод
  </button>

  <div id="cameraWrapper" class="camera-wrapper">
    <div id="reader"></div>

    <button
      class="close-camera"
      onclick="closeCamera()"
    >
      Закрыть камеру
    </button>
  </div>

  <div id="status" class="status"></div>

  <div id="results"></div>

  <button
    id="updateButton"
    class="update-button"
    onclick="updateDatabase()"
  >
    Обновить базу
  </button>

  <div id="footer" class="footer"></div>

</div>


<script>

  // =========================================================
  // НАСТРОЙКИ
  // =========================================================

  const API_URL =
    'https://script.google.com/macros/s/AKfycbwLJNTns2VnOebnan30cDWpad1tZaTtjI2g8B44HP6oj0M806NbzsZLcgn_9XkO-pwL/exec';

  const STORAGE_KEY = 'SCANINK_DATABASE_V3';

  let databaseData = null;
  let products = {};

  let html5QrCode = null;
  let cameraOpen = false;
  let cameraScriptLoaded = false;


  // =========================================================
  // НОРМАЛИЗАЦИЯ ТЕКСТА
  // =========================================================

  function normalizeText(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/\s+/g, ' ')
      .trim();
  }


  // =========================================================
  // НОРМАЛИЗАЦИЯ КОДА 1С
  //
  // 00000200820 → 200820
  // 00000002029 → 2029
  // 200820 → 200820
  // =========================================================

  function normalizeCode(code) {

    const digits = String(code || '')
      .replace(/\D/g, '');

    if (!digits) {
      return '';
    }

    return digits.replace(/^0+/, '') || '0';
  }


  // =========================================================
  // ПОИСКОВЫЕ СЛОВА
  // =========================================================

  function getSearchWords(text) {

    return normalizeText(text)
      .split(' ')
      .filter(Boolean);

  }


  // =========================================================
  // ФОРМАТ ЦЕНЫ
  // =========================================================

  function formatPrice(price) {

    if (!price) {
      return '—';
    }

    const text = String(price).trim();

    if (!text) {
      return '—';
    }

    const number = Number(
      text
        .replace(/\s/g, '')
        .replace(',', '.')
    );

    if (!Number.isNaN(number)) {

      return number.toLocaleString('ru-RU', {
        maximumFractionDigits: 2
      }) + ' ₽';

    }

    return text + ' ₽';
  }


  // =========================================================
  // ОЧИСТКА РЕЗУЛЬТАТОВ
  // =========================================================

  function clearResults() {

    document.getElementById('results').innerHTML = '';

  }


  // =========================================================
  // ПОИСК
  // =========================================================

  function searchProducts(query) {

    const text = normalizeText(query);

    if (!text) {
      clearResults();
      return;
    }


    // -------------------------------------------------------
    // 1. ТОЧНОЕ СОВПАДЕНИЕ ШТРИХКОДА
    // -------------------------------------------------------

    const exactBarcode = products[text];

    if (exactBarcode) {

      showSingleProduct(exactBarcode);

      return;

    }


    // -------------------------------------------------------
    // 2. ПОИСК ПО КОДУ 1С
    //
    // Пользователь может написать:
    //
    // 200820
    //
    // а в базе:
    //
    // 00000200820
    // -------------------------------------------------------

    const queryCode = normalizeCode(text);

    if (queryCode) {

      const keys = Object.keys(products);

      for (let i = 0; i < keys.length; i++) {

        const product = products[keys[i]];

        if (!product.code1c) {
          continue;
        }

        const productCode = normalizeCode(product.code1c);

        if (productCode === queryCode) {

          showSingleProduct(product);

          return;

        }

      }

    }


    // -------------------------------------------------------
    // 3. ПОИСК ПО НАЗВАНИЮ
    // -------------------------------------------------------

    const words = getSearchWords(text);

    const found = [];

    const keys = Object.keys(products);

    for (let i = 0; i < keys.length; i++) {

      const product = products[keys[i]];

      const name = normalizeText(product.name);

      const allWordsMatch = words.every(word =>
        name.includes(word)
      );

      if (allWordsMatch) {

        found.push(product);

      }

      if (found.length >= 30) {
        break;
      }

    }

    showSearchResults(found, query);

  }


  // =========================================================
  // ОДИН ТОВАР
  // =========================================================

  function showSingleProduct(product) {

    const results = document.getElementById('results');

    results.innerHTML = `

      <div class="result-card">

        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>


        <div class="product-row">
          <span>Штрихкод</span>
          <strong>
            ${escapeHtml(product.barcode || '—')}
          </strong>
        </div>


        <div class="product-row">
          <span>Код 1С</span>
          <strong>
            ${escapeHtml(product.code1c || '—')}
          </strong>
        </div>


        <div class="product-row stock-main">
          <span>Доступный остаток</span>
          <strong>
            ${escapeHtml(product.available || '0')}
          </strong>
        </div>


        <div class="product-row stock-total">
          <span>Остаток</span>
          <strong>
            ${escapeHtml(product.stock || '0')}
          </strong>
        </div>


        <div class="product-row price">
          <span>Цена</span>
          <strong>
            ${formatPrice(product.price)}
          </strong>
        </div>


        <div class="meta">
          Данные обновлены:
          ${escapeHtml(product.updatedAt || '—')}
        </div>


        <button
          class="next-scan"
          onclick="prepareNextScan()"
        >
          Сканировать следующий
        </button>

      </div>

    `;

  }


  // =========================================================
  // СПИСОК РЕЗУЛЬТАТОВ
  // =========================================================

  function showSearchResults(found, query) {

    const results = document.getElementById('results');

    if (!found.length) {

      results.innerHTML = `
        <div class="empty">
          Ничего не найдено
        </div>
      `;

      return;

    }


    let html = '';

    for (let i = 0; i < found.length; i++) {

      const product = found[i];

      html += `

        <div
          class="search-result"
          onclick='selectProduct(${JSON.stringify(product)})'
        >

          <div class="search-result-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="search-result-info">

            <span>
              Код 1С:
              ${escapeHtml(product.code1c || '—')}
            </span>

            <span>
              ${escapeHtml(product.available || '0')} шт.
            </span>

          </div>

        </div>

      `;

    }


    results.innerHTML = html;

  }


  // =========================================================
  // ВЫБОР ТОВАРА ИЗ СПИСКА
  // =========================================================

  function selectProduct(product) {

    showSingleProduct(product);

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });

  }


  // =========================================================
  // ПОДГОТОВКА К СЛЕДУЮЩЕМУ СКАНУ
  // =========================================================

  function prepareNextScan() {

    document.getElementById('searchInput').value = '';

    clearResults();

    document.getElementById('searchInput').focus();

  }


  // =========================================================
  // БЕЗОПАСНЫЙ HTML
  // =========================================================

  function escapeHtml(value) {

    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  // =========================================================
  // ЗАГРУЗКА БАЗЫ ЧЕРЕЗ JSONP
  // =========================================================

  function loadDatabaseFromServer() {

    return new Promise((resolve, reject) => {

      const callbackName =
        'receiveScanInkDatabase_' + Date.now();


      window[callbackName] = function(data) {

        try {

          delete window[callbackName];

          if (!data || !data.products) {

            reject(
              new Error('Некорректная база данных')
            );

            return;

          }

          resolve(data);

        } catch (error) {

          reject(error);

        }

      };


      const script =
        document.createElement('script');


      script.src =
        API_URL +
        '?mode=database' +
        '&callback=' +
        callbackName +
        '&v=' +
        Date.now();


      script.onerror = function() {

        delete window[callbackName];

        reject(
          new Error('Не удалось загрузить базу')
        );

      };


      document.body.appendChild(script);

    });

  }


  // =========================================================
  // СОХРАНЕНИЕ БАЗЫ
  // =========================================================

  function saveDatabase(data) {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

    } catch (error) {

      console.error(
        'Ошибка LocalStorage:',
        error
      );

    }

  }


  // =========================================================
  // ЗАГРУЗКА БАЗЫ ИЗ LOCALSTORAGE
  // =========================================================

  function loadDatabaseFromStorage() {

    try {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        return null;
      }

      return JSON.parse(saved);

    } catch (error) {

      console.error(
        'Ошибка чтения базы:',
        error
      );

      return null;

    }

  }


  // =========================================================
  // УСТАНОВКА БАЗЫ
  // =========================================================

  function setDatabase(data) {

    databaseData = data;

    products =
      data.products || {};

    updateFooter();

  }


  // =========================================================
  // ОБНОВЛЕНИЕ БАЗЫ
  // =========================================================

  async function updateDatabase() {

    const button =
      document.getElementById('updateButton');

    const status =
      document.getElementById('status');


    button.classList.add('loading');

    button.textContent = 'Обновляем базу...';

    status.textContent =
      'Загружаем актуальную базу';


    try {

      const data =
        await loadDatabaseFromServer();


      setDatabase(data);

      saveDatabase(data);


      status.textContent =
        'База успешно обновлена';


      setTimeout(() => {

        status.textContent = '';

      }, 2500);


    } catch (error) {

      console.error(error);

      status.textContent =
        'Ошибка обновления базы';

    }


    button.classList.remove('loading');

    button.textContent =
      'Обновить базу';

  }


  // =========================================================
  // FOOTER
  // =========================================================

  function updateFooter() {

    const footer =
      document.getElementById('footer');


    if (!databaseData) {

      footer.innerHTML = '';

      return;

    }


    let updated = '—';

    if (databaseData.updatedAt) {

      try {

        updated =
          new Date(
            databaseData.updatedAt
          ).toLocaleString('ru-RU');

      } catch (error) {

        updated =
          databaseData.updatedAt;

      }

    }


    footer.innerHTML = `
      Товаров в базе:
      ${databaseData.count || Object.keys(products).length}
      <br>
      База обновлена:
      ${escapeHtml(updated)}
    `;

  }


  // =========================================================
  // ЗАГРУЗКА HTML5 QR CODE
  // =========================================================

  function loadCameraLibrary() {

    return new Promise((resolve, reject) => {

      if (cameraScriptLoaded &&
          typeof Html5Qrcode !== 'undefined') {

        resolve();

        return;

      }


      const urls = [

        'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',

        'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'

      ];


      let index = 0;


      function tryNext() {

        if (index >= urls.length) {

          reject(
            new Error(
              'Не удалось загрузить сканер'
            )
          );

          return;

        }


        const script =
          document.createElement('script');


        script.src =
          urls[index++];


        script.onload = function() {

          if (
            typeof Html5Qrcode !==
            'undefined'
          ) {

            cameraScriptLoaded = true;

            resolve();

          } else {

            tryNext();

          }

        };


        script.onerror = function() {

          tryNext();

        };


        document.head.appendChild(script);

      }


      tryNext();

    });

  }


  // =========================================================
  // ОТКРЫТЬ КАМЕРУ
  // =========================================================

  async function openCamera() {

    if (cameraOpen) {
      return;
    }


    const status =
      document.getElementById('status');


    try {

      status.textContent =
        'Запускаем камеру...';


      await loadCameraLibrary();


      document.getElementById(
        'cameraWrapper'
      ).style.display = 'block';


      document.getElementById(
        'cameraButton'
      ).textContent = '📷 Камера открыта';


      html5QrCode =
        new Html5Qrcode('reader');


      cameraOpen = true;


      await html5QrCode.start(

        {
          facingMode: 'environment'
        },

        {
          fps: 10,

          qrbox: {
            width: 280,
            height: 160
          },

          aspectRatio: 1.777778

        },

        function(decodedText) {

          if (!decodedText) {
            return;
          }


          closeCamera();


          const input =
            document.getElementById(
              'searchInput'
            );


          input.value = decodedText;


          searchProducts(decodedText);

        },

        function(errorMessage) {

          // Ошибки отсутствия штрихкода
          // здесь намеренно игнорируем.

        }

      );


      status.textContent = '';

    } catch (error) {

      console.error(error);

      status.textContent =
        'Не удалось открыть камеру';

      document.getElementById(
        'cameraWrapper'
      ).style.display = 'none';

      cameraOpen = false;

    }

  }


  // =========================================================
  // ЗАКРЫТЬ КАМЕРУ
  // =========================================================

  async function closeCamera() {

    if (
      html5QrCode &&
      cameraOpen
    ) {

      try {

        await html5QrCode.stop();

      } catch (error) {

        console.log(error);

      }


      try {

        html5QrCode.clear();

      } catch (error) {

        console.log(error);

      }

    }


    html5QrCode = null;

    cameraOpen = false;


    document.getElementById(
      'cameraWrapper'
    ).style.display = 'none';


    document.getElementById(
      'cameraButton'
    ).textContent =
      '📷 Сканировать штрихкод';

  }


  // =========================================================
  // ПОИСК ПРИ ВВОДЕ
  // =========================================================

  document
    .getElementById('searchInput')
    .addEventListener(
      'input',
      function() {

        searchProducts(this.value);

      }
    );


  // =========================================================
  // ENTER
  // =========================================================

  document
    .getElementById('searchInput')
    .addEventListener(
      'keydown',
      function(event) {

        if (event.key === 'Enter') {

          event.preventDefault();

          searchProducts(this.value);

        }

      }
    );


  // =========================================================
  // ИНИЦИАЛИЗАЦИЯ
  // =========================================================

  async function init() {

    const saved =
      loadDatabaseFromStorage();


    if (saved && saved.products) {

      setDatabase(saved);

      document.getElementById(
        'status'
      ).textContent = '';

      return;

    }


    document.getElementById(
      'status'
    ).textContent =
      'Загружаем актуальную базу...';


    try {

      const data =
        await loadDatabaseFromServer();


      setDatabase(data);

      saveDatabase(data);


      document.getElementById(
        'status'
      ).textContent = '';


    } catch (error) {

      console.error(error);

      document.getElementById(
        'status'
      ).textContent =
        'Не удалось загрузить базу';

    }

  }


  init();

</script>

</body>
</html>
