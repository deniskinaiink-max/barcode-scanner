<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Сканер товара</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #000;
      color: #fff;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin: 15px 0 25px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #000;
    }

    #reader {
      margin-top: 20px;
      border-radius: 15px;
      overflow: hidden;
    }

    .card {
      margin-top: 25px;
      padding: 22px;
      border-radius: 18px;
      background: #181818;
    }

    .name {
      font-size: 25px;
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 25px;
    }

    .row {
      font-size: 18px;
      margin: 18px 0;
    }

    .stock {
      display: block;
      font-size: 34px;
      font-weight: bold;
      margin-top: 5px;
    }

    .price {
      display: block;
      font-size: 30px;
      font-weight: bold;
      margin-top: 5px;
    }

    .barcode {
      color: #888;
      font-size: 14px;
      margin-top: 25px;
    }

    .error {
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      background: #222;
      color: #ff6b6b;
      font-size: 18px;
    }

    .loading {
      margin-top: 25px;
      padding: 20px;
      text-align: center;
      font-size: 18px;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📦 Сканер товара</h1>


  <!-- СКАНЕР -->

  <button
    id="start"
    type="button">

    📷 СКАНИРОВАТЬ ШТРИХКОД

  </button>


  <div id="reader"></div>


  <!-- СООБЩЕНИЕ -->

  <div id="message">

    Нажмите кнопку и наведите камеру на штрихкод

  </div>


  <!-- РЕЗУЛЬТАТ -->

  <div id="product"></div>


  <!-- СКАНИРОВАТЬ ЕЩЁ -->

  <button
    id="next"
    class="hidden"
    type="button">

    📷 СКАНИРОВАТЬ СЛЕДУЮЩИЙ

  </button>

</div>


<script>


const API_URL =
  'https://script.google.com/macros/s/AKfycbwLJNTns2VnOebnan30cDWpad1tZaTtjI2g8B44HP6oj0M806NbzsZLcgn_9XkO-pwL/exec';


let scanner = null;


const startButton =
  document.getElementById('start');

const nextButton =
  document.getElementById('next');

const reader =
  document.getElementById('reader');

const message =
  document.getElementById('message');

const product =
  document.getElementById('product');



function startScanner() {

  if (scanner) {
    return;
  }


  product.innerHTML = '';

  nextButton.classList.add('hidden');

  startButton.classList.add('hidden');

  message.innerHTML =
    '📷 Наведите камеру на штрихкод';


  scanner =
    new Html5Qrcode('reader');


  scanner.start(

    {
      facingMode: 'environment'
    },

    {

      fps: 10,

      qrbox: {
        width: 300,
        height: 150
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39

      ]

    },


    function(decodedText) {

      stopScanner();

      loadProduct(decodedText);

    },


    function() {}

  )


  .catch(function(error) {

    scanner = null;

    startButton.classList.remove('hidden');

    message.innerHTML =
      '<div class="error">' +
      'Не удалось включить камеру.<br><br>' +
      error +
      '</div>';

  });

}



function stopScanner() {

  if (!scanner) {
    return;
  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });


  reader.innerHTML = '';

}



async function loadProduct(barcode) {

  message.innerHTML =
    '<div class="loading">' +
    '🔄 Ищем товар...' +
    '</div>';


  try {


    const response =

      await fetch(

        API_URL +
        '?barcode=' +
        encodeURIComponent(barcode)

      );


    if (!response.ok) {

      throw new Error(
        'Ошибка сервера: ' +
        response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      product.innerHTML =

        '<div class="error">' +

        'Товар не найден' +

        '<br><br>' +

        'Штрихкод: ' +
        barcode +

        '</div>';

    }

    else {


      product.innerHTML =

        '<div class="card">' +

          '<div class="name">' +

            escapeHtml(data.name) +

          '</div>' +


          '<div class="row">' +

            '<b>Доступный остаток:</b>' +

            '<span class="stock">' +

              escapeHtml(data.available) +

            '</span>' +

          '</div>' +


          '<div class="row">' +

            '<b>Остаток:</b>' +

            '<span class="stock">' +

              escapeHtml(data.stock) +

            '</span>' +

          '</div>' +


          '<div class="row">' +

            '<b>Цена:</b>' +

            '<span class="price">' +

              escapeHtml(data.price) +

              ' ₽' +

            '</span>' +

          '</div>' +


          '<div class="barcode">' +

            'Штрихкод: ' +

            escapeHtml(data.barcode) +

          '</div>' +

        '</div>';

    }


    message.innerHTML = '';

    nextButton.classList.remove('hidden');


  }


  catch(error) {


    message.innerHTML =

      '<div class="error">' +

      'Не удалось получить данные.<br><br>' +

      error.message +

      '</div>';


    nextButton.classList.remove('hidden');

  }

}



function escapeHtml(value) {

  return String(value ?? '')

    .replace(/&/g, '&amp;')

    .replace(/</g, '&lt;')

    .replace(/>/g, '&gt;')

    .replace(/"/g, '&quot;')

    .replace(/'/g, '&#039;');

}



startButton.onclick =
  startScanner;


nextButton.onclick =
  startScanner;



// Запускаем камеру сразу,
// если пришли с параметром ?scan=1

const params =
  new URLSearchParams(
    window.location.search
  );


if (params.get('scan') === '1') {

  setTimeout(
    startScanner,
    300
  );

}

</script>

</body>

</html>
