<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Стройцентр Инком — Проверка товара</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #f5f5f7;
  color: #111;
}

body {
  min-height: 100vh;
}

.container {
  max-width: 650px;
  margin: 0 auto;
  padding: 20px 16px 30px;
}

.header {
  margin-bottom: 18px;
}

.company {
  font-size: 14px;
  font-weight: 600;
  opacity: .65;
}

.title {
  font-size: 28px;
  font-weight: 700;
  margin-top: 3px;
}

.search-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.search-input {
  flex: 1;
  min-width: 0;
  height: 52px;
  padding: 0 16px;
  border: 1px solid #d2d2d7;
  border-radius: 14px;
  background: white;
  font-size: 17px;
  outline: none;
}

.search-input:focus {
  border-color: #888;
}

.button {
  border: 0;
  border-radius: 14px;
  padding: 0 16px;
  height: 52px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.camera-button {
  background: #111;
  color: white;
}

.update-button {
  width: 100%;
  margin-top: 10px;
  background: #e9e9ed;
  color: #111;
}

.update-button.loading {
  opacity: .6;
}

#reader {
  display: none;
  width: 100%;
  margin-top: 12px;
  border-radius: 16px;
  overflow: hidden;
  background: #000;
}

.camera-controls {
  display: none;
  margin-top: 8px;
  gap: 8px;
}

.camera-controls button {
  flex: 1;
}

.status {
  min-height: 22px;
  margin: 8px 2px;
  font-size: 14px;
  color: #666;
}

.results {
  margin-top: 12px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.product-name {
  font-size: 19px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 14px;
}

.meta {
  font-size: 14px;
  color: #666;
  margin-top: 5px;
}

.stock-main {
  margin-top: 18px;
  font-size: 38px;
  line-height: 1;
  font-weight: 800;
}

.stock-label {
  font-size: 13px;
  color: #777;
  margin-top: 4px;
}

.stock-total {
  margin-top: 10px;
  font-size: 15px;
  color: #555;
}

.price {
  margin-top: 16px;
  font-size: 28px;
  font-weight: 750;
}

.next-button {
  width: 100%;
  margin-top: 16px;
  background: #111;
  color: white;
}

.no-results {
  text-align: center;
  color: #777;
  padding: 30px 10px;
}

.footer {
  margin-top: 22px;
  font-size: 12px;
  color: #888;
  text-align: center;
  line-height: 1.5;
}

.db-info {
  margin-top: 8px;
}

@media (prefers-color-scheme: dark) {

  html,
  body {
    background: #111;
    color: #f5f5f7;
  }

  .search-input {
    background: #1c1c1e;
    border-color: #38383a;
    color: white;
  }

  .update-button {
    background: #2c2c2e;
    color: white;
  }

  .card {
    background: #1c1c1e;
  }

  .meta,
  .status,
  .stock-label,
  .stock-total,
  .footer {
    color: #98989f;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="company">СТРОЙЦЕНТР ИНКОМ</div>
    <div class="title">Проверка товара</div>
  </div>

  <div class="search-row">

    <input
      id="searchInput"
      class="search-input"
      type="text"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Штрихкод, код 1С или название"
    >

    <button
      id="cameraButton"
      class="button camera-button">
      📷
    </button>

  </div>

  <div id="reader"></div>

  <div id="cameraControls" class="camera-controls">
    <button
      id="closeCameraButton"
      class="button update-button">
      Закрыть камеру
    </button>
  </div>

  <div id="status" class="status"></div>

  <div id="results" class="results"></div>

  <button
    id="updateButton"
    class="button update-button">
    Обновить базу
  </button>

  <div class="footer">

    <div id="dbCount"></div>

    <div id="dbInfo" class="db-info"></div>

  </div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbwLJNTns2VnOebnan30cDWpad1tZaTtjI2g8B44HP6oj0M806NbzsZLcgn_9XkO-pwL/exec';


/*
==================================================
НАСТРОЙКИ ЛОКАЛЬНОЙ БАЗЫ
==================================================
*/

/*
Используем новое имя базы.

Это важно:
если на телефоне осталась старая
IndexedDB от предыдущих экспериментов,
она больше не будет мешать.
*/

const DB_NAME = 'ScanInkDatabaseV2';

const DB_VERSION = 1;

const STORE_NAME = 'database';

const DB_KEY = 'current';


let databaseData = null;

let products = {};

let html5QrCode = null;

let cameraRunning = false;


/*
==================================================
INDEXED DB
==================================================
*/

function openDatabase() {

  return new Promise((resolve, reject) => {

    if (!window.indexedDB) {

      reject(
        new Error('IndexedDB не поддерживается')
      );

      return;
    }

    const request =
      indexedDB.open(DB_NAME, DB_VERSION);


    request.onupgradeneeded = function(event) {

      const db = event.target.result;

      if (
        !db.objectStoreNames.contains(STORE_NAME)
      ) {

        db.createObjectStore(STORE_NAME);

      }

    };


    request.onsuccess = function(event) {

      resolve(event.target.result);

    };


    request.onerror = function(event) {

      reject(
        event.target.error ||
        new Error('Ошибка открытия IndexedDB')
      );

    };

  });

}


/*
==================================================
СОХРАНЕНИЕ БАЗЫ
==================================================
*/

async function saveDatabase(data) {

  const db = await openDatabase();

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        STORE_NAME,
        'readwrite'
      );

    const store =
      transaction.objectStore(STORE_NAME);


    const request =
      store.put(data, DB_KEY);


    request.onerror = function(event) {

      reject(
        event.target.error ||
        new Error('Не удалось сохранить базу')
      );

    };


    transaction.oncomplete = function() {

      db.close();

      resolve();

    };


    transaction.onerror = function(event) {

      db.close();

      reject(
        event.target.error ||
        new Error('Ошибка записи IndexedDB')
      );

    };

  });

}


/*
==================================================
ЗАГРУЗКА ЛОКАЛЬНОЙ БАЗЫ
==================================================
*/

async function loadDatabaseFromStorage() {

  const db = await openDatabase();

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        STORE_NAME,
        'readonly'
      );

    const store =
      transaction.objectStore(STORE_NAME);


    const request =
      store.get(DB_KEY);


    request.onsuccess = function(event) {

      const data = event.target.result || null;

      db.close();

      resolve(data);

    };


    request.onerror = function(event) {

      db.close();

      reject(
        event.target.error ||
        new Error('Не удалось прочитать базу')
      );

    };

  });

}


/*
==================================================
JSONP
==================================================
*/

function jsonp(url) {

  return new Promise((resolve, reject) => {

    const callbackName =
      'scanInkCallback_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .substring(2);


    const script =
      document.createElement('script');


    const timeout =
      setTimeout(() => {

        cleanup();

        reject(
          new Error('Истекло время ожидания')
        );

      }, 60000);


    function cleanup() {

      clearTimeout(timeout);

      script.remove();

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

    }


    window[callbackName] =
      function(data) {

        cleanup();

        resolve(data);

      };


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error('Ошибка загрузки данных')
        );

      };


    script.src =
      url +
      '&callback=' +
      encodeURIComponent(callbackName);


    document.body.appendChild(script);

  });

}


/*
==================================================
ПОЛНАЯ ЗАГРУЗКА БАЗЫ
==================================================
*/

async function loadDatabaseFromServer() {

  const url =
    API_URL +
    '?mode=database&_=' +
    Date.now();


  return await jsonp(url);

}


/*
==================================================
ПРОВЕРКА ТОЛЬКО ВЕРСИИ
==================================================
*/

async function getServerVersion() {

  const url =
    API_URL +
    '?mode=version&_=' +
    Date.now();


  return await jsonp(url);

}


/*
==================================================
УСТАНОВКА БАЗЫ В ПАМЯТЬ
==================================================
*/

function setDatabase(data) {

  databaseData = data;

  products =
    data.products || {};


  document.getElementById('dbCount')
    .textContent =
      'Товаров в базе: ' +
      Number(data.count || 0)
        .toLocaleString('ru-RU');


  let updatedText = '';


  if (data.updatedAt) {

    try {

      const date =
        new Date(data.updatedAt);

      updatedText =
        date.toLocaleString(
          'ru-RU',
          {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }
        );

    } catch (e) {

      updatedText =
        String(data.updatedAt);

    }

  }


  document.getElementById('dbInfo')
    .textContent =
      'Версия: ' +
      String(data.version || '—') +
      (updatedText
        ? ' · Обновлено: ' + updatedText
        : '');

}


/*
==================================================
НОРМАЛИЗАЦИЯ КОДА 1С
==================================================
*/

function normalizeCode(value) {

  const digits =
    String(value || '')
      .replace(/\D/g, '');


  if (!digits) return '';

  return (
    digits.replace(/^0+/, '') ||
    '0'
  );

}


/*
==================================================
ПОИСК
==================================================
*/

function searchProducts(query) {

  query =
    String(query || '')
      .trim();


  if (!query) {

    renderResults([]);

    return;

  }


  const normalizedCode =
    normalizeCode(query);


  /*
  Сначала пробуем точное совпадение
  по штрихкоду.
  */

  if (products[query]) {

    renderResults([
      products[query]
    ]);

    return;

  }


  /*
  Затем точное совпадение
  по коду 1С.
  */

  if (normalizedCode) {

    const exactCodeResults = [];

    const keys =
      Object.keys(products);


    for (let i = 0; i < keys.length; i++) {

      const product =
        products[keys[i]];


      if (
        normalizeCode(product.code1c) ===
        normalizedCode
      ) {

        exactCodeResults.push(product);

      }

    }


    if (exactCodeResults.length) {

      renderResults(
        exactCodeResults.slice(0, 30)
      );

      return;

    }

  }


  /*
  Поиск по названию.
  */

  const words =
    query
      .toLowerCase()
      .split(/\s+/)
      .filter(Boolean);


  const results = [];

  const keys =
    Object.keys(products);


  for (let i = 0; i < keys.length; i++) {

    const product =
      products[keys[i]];


    const name =
      String(product.name || '')
        .toLowerCase();


    let matches = true;


    for (let j = 0; j < words.length; j++) {

      if (!name.includes(words[j])) {

        matches = false;

        break;

      }

    }


    if (matches) {

      results.push(product);

      if (results.length >= 30) {

        break;

      }

    }

  }


  renderResults(results);

}


/*
==================================================
ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ
==================================================
*/

function renderResults(results) {

  const container =
    document.getElementById('results');


  container.innerHTML = '';


  if (!results.length) {

    if (
      document.getElementById('searchInput')
        .value.trim()
    ) {

      container.innerHTML =
        '<div class="no-results">' +
        'Ничего не найдено' +
        '</div>';

    }

    return;

  }


  results.forEach(product => {

    const card =
      document.createElement('div');

    card.className = 'card';


    const name =
      document.createElement('div');

    name.className =
      'product-name';

    name.textContent =
      product.name || 'Без названия';


    const barcode =
      document.createElement('div');

    barcode.className =
      'meta';

    barcode.textContent =
      'Штрихкод: ' +
      (product.barcode || '—');


    const code =
      document.createElement('div');

    code.className =
      'meta';

    code.textContent =
      'Код 1С: ' +
      (product.code1c || '—');


    const stockLabel =
      document.createElement('div');

    stockLabel.className =
      'stock-label';

    stockLabel.textContent =
      'Доступный остаток';


    const stock =
      document.createElement('div');

    stock.className =
      'stock-main';

    stock.textContent =
      product.available || '0';


    const total =
      document.createElement('div');

    total.className =
      'stock-total';

    total.textContent =
      'Остаток: ' +
      (product.stock || '0');


    const price =
      document.createElement('div');

    price.className =
      'price';

    price.textContent =
      (product.price || '—') +
      ' ₽';


    const updated =
      document.createElement('div');

    updated.className =
      'meta';

    updated.style.marginTop =
      '10px';

    updated.textContent =
      'Последнее обновление: ' +
      (product.updatedAt || '—');


    const nextButton =
      document.createElement('button');

    nextButton.className =
      'button next-button';

    nextButton.textContent =
      'Сканировать следующий';


    nextButton.onclick =
      function() {

        document.getElementById(
          'searchInput'
        ).value = '';

        container.innerHTML = '';

        document.getElementById(
          'searchInput'
        ).focus();

      };


    card.appendChild(name);

    card.appendChild(barcode);

    card.appendChild(code);

    card.appendChild(stockLabel);

    card.appendChild(stock);

    card.appendChild(total);

    card.appendChild(price);

    card.appendChild(updated);

    card.appendChild(nextButton);


    container.appendChild(card);

  });

}


/*
==================================================
АВТОМАТИЧЕСКАЯ ПРОВЕРКА ВЕРСИИ
==================================================
*/

async function checkForNewVersion() {

  if (!databaseData) {

    return;

  }


  try {

    const server =
      await getServerVersion();


    if (!server || !server.ok) {

      return;

    }


    const localVersion =
      Number(
        databaseData.version || 0
      );


    const serverVersion =
      Number(
        server.version || 0
      );


    console.log(
      'Локальная версия:',
      localVersion
    );


    console.log(
      'Версия сервера:',
      serverVersion
    );


    if (
      serverVersion >
      localVersion
    ) {

      const status =
        document.getElementById('status');


      status.textContent =
        'Доступна новая база. Обновляем...';


      const newDatabase =
        await loadDatabaseFromServer();


      /*
      Дополнительная защита:
      сохраняем только действительно
      более новую версию.
      */

      if (
        Number(newDatabase.version || 0) >=
        serverVersion
      ) {

        await saveDatabase(
          newDatabase
        );

        setDatabase(
          newDatabase
        );


        status.textContent =
          'База автоматически обновлена';


        setTimeout(() => {

          status.textContent = '';

        }, 2500);

      }

    }


  } catch (error) {

    console.error(
      'Ошибка проверки версии:',
      error
    );

    /*
    Здесь специально ничего
    не показываем пользователю.

    Если интернет временно недоступен,
    старая база продолжает работать.
    */

  }

}


/*
==================================================
ПРИНУДИТЕЛЬНОЕ ОБНОВЛЕНИЕ
==================================================
*/

async function updateDatabase() {

  const button =
    document.getElementById(
      'updateButton'
    );

  const status =
    document.getElementById(
      'status'
    );


  button.classList.add(
    'loading'
  );

  button.disabled = true;

  button.textContent =
    'Обновляем базу...';


  status.textContent =
    'Загружаем актуальную базу...';


  try {

    const data =
      await loadDatabaseFromServer();


    if (
      !data ||
      !data.products
    ) {

      throw new Error(
        'Сервер вернул некорректную базу'
      );

    }


    status.textContent =
      'Сохраняем базу на устройстве...';


    await saveDatabase(data);


    setDatabase(data);


    status.textContent =
      'База успешно обновлена';


    setTimeout(() => {

      status.textContent = '';

    }, 2500);


  } catch (error) {

    console.error(error);


    status.textContent =
      'Ошибка обновления базы';


  } finally {

    button.classList.remove(
      'loading'
    );

    button.disabled = false;

    button.textContent =
      'Обновить базу';

  }

}


/*
==================================================
КАМЕРА
==================================================
*/

function loadScannerLibrary() {

  return new Promise((resolve, reject) => {

    if (window.Html5Qrcode) {

      resolve();

      return;

    }


    const script =
      document.createElement('script');


    script.src =
      'https://unpkg.com/html5-qrcode';


    script.onload =
      () => resolve();


    script.onerror =
      () => reject(
        new Error(
          'Не удалось загрузить сканер'
        )
      );


    document.head.appendChild(script);

  });

}


async function startCamera() {

  try {

    await loadScannerLibrary();


    document.getElementById(
      'reader'
    ).style.display = 'block';


    document.getElementById(
      'cameraControls'
    ).style.display = 'flex';


    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode(
          'reader'
        );

    }


    await html5QrCode.start(

      {
        facingMode: 'environment'
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 160
        },

        aspectRatio: 1.777778

      },

      decodedText => {

        document.getElementById(
          'searchInput'
        ).value =
          decodedText;


        searchProducts(
          decodedText
        );


        stopCamera();

      },

      errorMessage => {
        // Игнорируем ошибки отдельных кадров
      }

    );


    cameraRunning = true;


  } catch (error) {

    console.error(error);


    document.getElementById(
      'status'
    ).textContent =
      'Не удалось открыть камеру';

  }

}


async function stopCamera() {

  if (
    html5QrCode &&
    cameraRunning
  ) {

    try {

      await html5QrCode.stop();

    } catch (e) {

      console.error(e);

    }

  }


  cameraRunning = false;


  document.getElementById(
    'reader'
  ).style.display = 'none';


  document.getElementById(
    'cameraControls'
  ).style.display = 'none';

}


/*
==================================================
ПОИСК ПРИ ВВОДЕ
==================================================
*/

document.getElementById(
  'searchInput'
).addEventListener(
  'input',
  function() {

    searchProducts(
      this.value
    );

  }
);


/*
==================================================
КАМЕРА
==================================================
*/

document.getElementById(
  'cameraButton'
).addEventListener(
  'click',
  function() {

    if (cameraRunning) {

      stopCamera();

    } else {

      startCamera();

    }

  }
);


document.getElementById(
  'closeCameraButton'
).addEventListener(
  'click',
  function() {

    stopCamera();

  }
);


/*
==================================================
КНОПКА ОБНОВЛЕНИЯ
==================================================
*/

document.getElementById(
  'updateButton'
).addEventListener(
  'click',
  function() {

    updateDatabase();

  }
);


/*
==================================================
ЗАПУСК
==================================================
*/

async function init() {

  const status =
    document.getElementById(
      'status'
    );


  /*
  Сначала пытаемся открыть
  локальную базу.
  */

  try {

    status.textContent =
      'Загружаем базу...';


    const saved =
      await loadDatabaseFromStorage();


    if (
      saved &&
      saved.products
    ) {

      /*
      Показываем её сразу.

      Пользователь может начинать
      поиск, не дожидаясь сервера.
      */

      setDatabase(saved);


      status.textContent = '';


      /*
      А теперь в фоне проверяем,
      нет ли более новой версии.
      */

      checkForNewVersion();


      return;

    }

  } catch (error) {

    console.error(
      'Ошибка IndexedDB:',
      error
    );

  }


  /*
  Если локальной базы нет —
  скачиваем полную базу.
  */

  status.textContent =
    'Первичная загрузка базы...';


  try {

    const data =
      await loadDatabaseFromServer();


    await saveDatabase(data);


    setDatabase(data);


    status.textContent = '';


  } catch (error) {

    console.error(error);


    status.textContent =
      'Не удалось загрузить базу';

  }

}


init();

</script>

</body>
</html>
