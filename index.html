<script>

/*
==================================================
НАСТРОЙКИ
==================================================
*/

const API_URL =
  'https://script.google.com/macros/s/AKfycbwLJNTns2VnOebnan30cDWpad1tZaTtjI2g8B44HP6oj0M806NbzsZLcgn_9XkO-pwL/exec';


const DB_NAME =
  'ScanInkDatabaseV2';


const DB_VERSION =
  1;


const STORE_NAME =
  'database';


const DB_KEY =
  'current';


let databaseData =
  null;


let products =
  {};


let html5QrCode =
  null;


let cameraRunning =
  false;


let scannerLibraryPromise =
  null;


/*
==================================================
INDEXED DB
==================================================
*/

function openDatabase() {

  return new Promise(
    (resolve, reject) => {

      if (!window.indexedDB) {

        reject(
          new Error(
            'IndexedDB не поддерживается'
          )
        );

        return;

      }


      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(STORE_NAME)
          ) {

            db.createObjectStore(
              STORE_NAME
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function(event) {

          reject(
            event.target.error ||
            new Error(
              'Ошибка открытия IndexedDB'
            )
          );

        };

    }
  );

}


/*
==================================================
СОХРАНЕНИЕ БАЗЫ
==================================================
*/

async function saveDatabase(data) {

  const db =
    await openDatabase();


  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          'readwrite'
        );


      transaction
        .objectStore(STORE_NAME)
        .put(
          data,
          DB_KEY
        );


      transaction.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaction.onerror =
        function(event) {

          db.close();

          reject(
            event.target.error ||
            new Error(
              'Ошибка записи IndexedDB'
            )
          );

        };


      transaction.onabort =
        function(event) {

          db.close();

          reject(
            event.target.error ||
            new Error(
              'Запись IndexedDB отменена'
            )
          );

        };

    }
  );

}


/*
==================================================
ЗАГРУЗКА ЛОКАЛЬНОЙ БАЗЫ
==================================================
*/

async function loadDatabaseFromStorage() {

  const db =
    await openDatabase();


  return new Promise(
    (resolve, reject) => {

      const transaction =
        db.transaction(
          STORE_NAME,
          'readonly'
        );


      const request =
        transaction
          .objectStore(STORE_NAME)
          .get(DB_KEY);


      request.onsuccess =
        function(event) {

          const data =
            event.target.result ||
            null;


          db.close();

          resolve(data);

        };


      request.onerror =
        function(event) {

          db.close();

          reject(
            event.target.error ||
            new Error(
              'Не удалось прочитать базу'
            )
          );

        };

    }
  );

}


/*
==================================================
JSONP
==================================================
*/

function jsonp(url) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'scanInkCallback_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      function cleanup() {

        clearTimeout(
          timeout
        );


        script.remove();


        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] = undefined;

        }

      }


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished =
              true;


            cleanup();


            reject(
              new Error(
                'Истекло время ожидания'
              )
            );

          },
          30000
        );


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          resolve(data);

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished =
            true;


          cleanup();


          reject(
            new Error(
              'Ошибка JSONP'
            )
          );

        };


      script.src =
        url +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


/*
==================================================
ПОЛУЧЕНИЕ ВЕРСИИ СЕРВЕРА
==================================================
*/

async function getServerVersion() {

  return jsonp(
    API_URL +
    '?mode=version&_=' +
    Date.now()
  );

}


/*
==================================================
ПОЛУЧЕНИЕ ПОЛНОЙ БАЗЫ
==================================================
*/

async function loadDatabaseFromServer() {

  const response =
    await fetch(
      API_URL +
      '?mode=database&_=' +
      Date.now(),
      {
        method: 'GET',
        cache: 'no-store'
      }
    );


  if (!response.ok) {

    throw new Error(
      'Сервер вернул HTTP ' +
      response.status
    );

  }


  const data =
    await response.json();


  if (
    !data ||
    !data.products
  ) {

    throw new Error(
      'Сервер вернул некорректную базу'
    );

  }


  return data;

}


/*
==================================================
УСТАНОВКА БАЗЫ В ПАМЯТЬ
==================================================
*/

function setDatabase(data) {

  databaseData =
    data;


  products =
    data.products || {};


  document.getElementById(
    'dbCount'
  ).textContent =
    'Товаров в базе: ' +
    Number(
      data.count || 0
    ).toLocaleString(
      'ru-RU'
    );


  let updatedText =
    '';


  if (data.updatedAt) {

    try {

      updatedText =
        new Date(
          data.updatedAt
        ).toLocaleString(
          'ru-RU',
          {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }
        );

    } catch (e) {

      updatedText =
        String(
          data.updatedAt
        );

    }

  }


  document.getElementById(
    'dbInfo'
  ).textContent =
    'Версия: ' +
    String(
      data.version || '—'
    ) +
    (
      updatedText
        ? ' · Обновлено: ' +
          updatedText
        : ''
    );

}


/*
==================================================
НОРМАЛИЗАЦИЯ КОДА 1С
==================================================
*/

function normalizeCode(value) {

  const digits =
    String(
      value || ''
    )
      .replace(
        /\D/g,
        ''
      );


  if (!digits) {

    return '';

  }


  return (
    digits.replace(
      /^0+/,
      ''
    ) ||
    '0'
  );

}


/*
==================================================
ПОИСК
==================================================
*/

function searchProducts(query) {

  query =
    String(
      query || ''
    ).trim();


  if (!query) {

    renderResults([]);

    return;

  }


  /*
  1.
  Точное совпадение штрихкода.
  */

  if (products[query]) {

    renderResults([
      products[query]
    ]);

    return;

  }


  /*
  2.
  Точное совпадение кода 1С.
  */

  const normalizedCode =
    normalizeCode(query);


  if (normalizedCode) {

    const exactCodeResults =
      [];


    const keys =
      Object.keys(
        products
      );


    for (
      let i = 0;
      i < keys.length;
      i++
    ) {

      const product =
        products[
          keys[i]
        ];


      if (
        normalizeCode(
          product.code1c
        ) ===
        normalizedCode
      ) {

        exactCodeResults.push(
          product
        );


        if (
          exactCodeResults.length >= 30
        ) {

          break;

        }

      }

    }


    if (
      exactCodeResults.length
    ) {

      renderResults(
        exactCodeResults
      );

      return;

    }

  }


  /*
  3.
  Поиск по названию.
  */

  const words =
    query
      .toLowerCase()
      .split(/\s+/)
      .filter(Boolean);


  const results =
    [];


  const keys =
    Object.keys(
      products
    );


  for (
    let i = 0;
    i < keys.length;
    i++
  ) {

    const product =
      products[
        keys[i]
      ];


    const name =
      String(
        product.name || ''
      ).toLowerCase();


    let matches =
      true;


    for (
      let j = 0;
      j < words.length;
      j++
    ) {

      if (
        !name.includes(
          words[j]
        )
      ) {

        matches =
          false;

        break;

      }

    }


    if (matches) {

      results.push(
        product
      );


      if (
        results.length >= 30
      ) {

        break;

      }

    }

  }


  renderResults(
    results
  );

}


/*
==================================================
ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ
==================================================
*/

function renderResults(results) {

  const container =
    document.getElementById(
      'results'
    );


  container.innerHTML =
    '';


  if (!results.length) {

    if (
      document
        .getElementById(
          'searchInput'
        )
        .value
        .trim()
    ) {

      container.innerHTML =
        '<div class="no-results">' +
        'Ничего не найдено' +
        '</div>';

    }


    return;

  }


  results.forEach(
    function(product) {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'card';


      const name =
        document.createElement(
          'div'
        );


      name.className =
        'product-name';


      name.textContent =
        product.name ||
        'Без названия';


      const barcode =
        document.createElement(
          'div'
        );


      barcode.className =
        'meta';


      barcode.textContent =
        'Штрихкод: ' +
        (
          product.barcode ||
          '—'
        );


      const code =
        document.createElement(
          'div'
        );


      code.className =
        'meta';


      code.textContent =
        'Код 1С: ' +
        (
          product.code1c ||
          '—'
        );


      const stockLabel =
        document.createElement(
          'div'
        );


      stockLabel.className =
        'stock-label';


      stockLabel.textContent =
        'Доступный остаток';


      const stock =
        document.createElement(
          'div'
        );


      stock.className =
        'stock-main';


      stock.textContent =
        product.available ||
        '0';


      const total =
        document.createElement(
          'div'
        );


      total.className =
        'stock-total';


      total.textContent =
        'Остаток: ' +
        (
          product.stock ||
          '0'
        );


      const price =
        document.createElement(
          'div'
        );


      price.className =
        'price';


      price.textContent =
        (
          product.price ||
          '—'
        ) +
        ' ₽';


      const updated =
        document.createElement(
          'div'
        );


      updated.className =
        'meta';


      updated.style.marginTop =
        '10px';


      updated.textContent =
        'Последнее обновление: ' +
        (
          product.updatedAt ||
          '—'
        );


      const nextButton =
        document.createElement(
          'button'
        );


      nextButton.className =
        'button next-button';


      nextButton.textContent =
        'Сканировать следующий';


      nextButton.onclick =
        function() {

          document.getElementById(
            'searchInput'
          ).value =
            '';


          container.innerHTML =
            '';


          document.getElementById(
            'searchInput'
          ).focus();

        };


      card.appendChild(
        name
      );

      card.appendChild(
        barcode
      );

      card.appendChild(
        code
      );

      card.appendChild(
        stockLabel
      );

      card.appendChild(
        stock
      );

      card.appendChild(
        total
      );

      card.appendChild(
        price
      );

      card.appendChild(
        updated
      );

      card.appendChild(
        nextButton
      );


      container.appendChild(
        card
      );

    }
  );

}


/*
==================================================
ПРОВЕРКА НОВОЙ ВЕРСИИ
==================================================
*/

async function checkForNewVersion() {

  if (!databaseData) {

    return;

  }


  try {

    const server =
      await getServerVersion();


    if (
      !server ||
      !server.ok
    ) {

      return;

    }


    const localVersion =
      Number(
        databaseData.version ||
        0
      );


    const serverVersion =
      Number(
        server.version ||
        0
      );


    if (
      serverVersion <=
      localVersion
    ) {

      return;

    }


    const status =
      document.getElementById(
        'status'
      );


    status.textContent =
      'Доступна новая база. Обновляем...';


    const newDatabase =
      await loadDatabaseFromServer();


    const newVersion =
      Number(
        newDatabase.version ||
        0
      );


    if (
      newVersion <
      serverVersion
    ) {

      throw new Error(
        'Получена старая версия базы'
      );

    }


    status.textContent =
      'Сохраняем новую базу...';


    await saveDatabase(
      newDatabase
    );


    setDatabase(
      newDatabase
    );


    status.textContent =
      'База автоматически обновлена';


    setTimeout(
      function() {

        status.textContent =
          '';

      },
      3000
    );


  } catch (error) {

    console.error(
      'Ошибка проверки версии:',
      error
    );


    const status =
      document.getElementById(
        'status'
      );


    status.textContent =
      'Не удалось проверить обновление';


    setTimeout(
      function() {

        status.textContent =
          '';

      },
      3000
    );

  }

}


/*
==================================================
ПРИНУДИТЕЛЬНОЕ ОБНОВЛЕНИЕ
==================================================
*/

async function updateDatabase() {

  const button =
    document.getElementById(
      'updateButton'
    );


  const status =
    document.getElementById(
      'status'
    );


  button.classList.add(
    'loading'
  );


  button.disabled =
    true;


  button.textContent =
    'Обновляем базу...';


  status.textContent =
    'Загружаем актуальную базу...';


  try {

    const data =
      await loadDatabaseFromServer();


    if (
      !data ||
      !data.products
    ) {

      throw new Error(
        'Сервер вернул некорректную базу'
      );

    }


    status.textContent =
      'Сохраняем базу на устройстве...';


    await saveDatabase(
      data
    );


    setDatabase(
      data
    );


    status.textContent =
      'База успешно обновлена';


    setTimeout(
      function() {

        status.textContent =
          '';

      },
      2500
    );


  } catch (error) {

    console.error(
      'Ошибка обновления:',
      error
    );


    status.textContent =
      'Ошибка обновления базы';


  } finally {

    button.classList.remove(
      'loading'
    );


    button.disabled =
      false;


    button.textContent =
      'Обновить базу';

  }

}


/*
==================================================
ЗАГРУЗКА СКАНЕРА
==================================================
*/

function loadScannerLibrary() {

  if (
    window.Html5Qrcode
  ) {

    return Promise.resolve();

  }


  if (
    scannerLibraryPromise
  ) {

    return scannerLibraryPromise;

  }


  scannerLibraryPromise =
    new Promise(
      (resolve, reject) => {

        const script =
          document.createElement(
            'script'
          );


        /*
        Фиксируем стабильную версию
        html5-qrcode.
        */

        script.src =
          'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';


        script.onload =
          function() {

            if (
              window.Html5Qrcode
            ) {

              resolve();

            } else {

              reject(
                new Error(
                  'Библиотека сканера загрузилась, но Html5Qrcode не найден'
                )
              );

            }

          };


        script.onerror =
          function() {

            scannerLibraryPromise =
              null;


            reject(
              new Error(
                'Не удалось загрузить сканер'
              )
            );

          };


        document.head.appendChild(
          script
        );

      }
    );


  return scannerLibraryPromise;

}


/*
==================================================
КАМЕРА
==================================================
*/

async function startCamera() {

  const status =
    document.getElementById(
      'status'
    );


  try {

    /*
    Проверяем HTTPS.
    */

    if (
      !window.isSecureContext
    ) {

      throw new Error(
        'Камера доступна только через HTTPS'
      );

    }


    /*
    Проверяем API камеры.
    */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'Браузер не предоставляет доступ к камере'
      );

    }


    status.textContent =
      'Запускаем камеру...';


    await loadScannerLibrary();


    if (
      !window.Html5Qrcode
    ) {

      throw new Error(
        'Библиотека сканера не загрузилась'
      );

    }


    /*
    Получаем реальные камеры телефона.
    */

    let cameras;


    try {

      cameras =
        await Html5Qrcode.getCameras();

    } catch (error) {

      throw new Error(
        (
          error &&
          error.name
            ? error.name + ': '
            : ''
        ) +
        (
          error &&
          error.message
            ? error.message
            : String(error)
        )
      );

    }


    if (
      !cameras ||
      !cameras.length
    ) {

      throw new Error(
        'Браузер не обнаружил ни одной камеры'
      );

    }


    /*
    Ищем заднюю камеру.

    Если название камеры браузер
    не передал — используем первую.
    */

    const camera =
      cameras.find(
        function(item) {

          const label =
            String(
              item.label || ''
            ).toLowerCase();


          return (
            label.includes('back') ||
            label.includes('rear') ||
            label.includes('environment') ||
            label.includes('зад')
          );

        }
      ) ||
      cameras[0];


    /*
    Показываем окно камеры.
    */

    document.getElementById(
      'reader'
    ).style.display =
      'block';


    /*
    Создаём сканер.
    */

    if (
      !html5QrCode
    ) {

      html5QrCode =
        new Html5Qrcode(
          'reader'
        );

    }


    /*
    Запускаем конкретную камеру
    по её ID.

    Это надёжнее для мобильных
    браузеров, чем только facingMode.
    */

    await html5QrCode.start(

      camera.id,

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 160
        }

      },


      /*
      Штрихкод найден.
      */

      function(decodedText) {

        document.getElementById(
          'searchInput'
        ).value =
          decodedText;


        searchProducts(
          decodedText
        );


        stopCamera();

      },


      /*
      Ошибки отдельных кадров
      игнорируем.
      */

      function(errorMessage) {

        // Ничего не делаем.

      }

    );


    cameraRunning =
      true;


    document.getElementById(
      'cameraControls'
    ).style.display =
      'flex';


    status.textContent =
      '';


  } catch (error) {

    console.error(
      'Ошибка камеры:',
      error
    );


    /*
    Теперь показываем настоящую
    ошибку камеры.
    */

    let message =
      error &&
      error.message
        ? error.message
        : String(error);


    if (
      error &&
      error.name &&
      !message.startsWith(
        error.name
      )
    ) {

      message =
        error.name +
        ': ' +
        message;

    }


    document.getElementById(
      'reader'
    ).style.display =
      'none';


    document.getElementById(
      'cameraControls'
    ).style.display =
      'none';


    cameraRunning =
      false;


    status.textContent =
      'Камера: ' +
      message;

  }

}


/*
==================================================
ОСТАНОВКА КАМЕРЫ
==================================================
*/

async function stopCamera() {

  if (
    html5QrCode &&
    cameraRunning
  ) {

    try {

      await html5QrCode.stop();

    } catch (error) {

      console.error(
        'Ошибка остановки камеры:',
        error
      );

    }

  }


  cameraRunning =
    false;


  document.getElementById(
    'reader'
  ).style.display =
    'none';


  document.getElementById(
    'cameraControls'
  ).style.display =
    'none';

}


/*
==================================================
ПОИСК
==================================================
*/

document.getElementById(
  'searchInput'
).addEventListener(
  'input',
  function() {

    searchProducts(
      this.value
    );

  }
);


/*
==================================================
КНОПКА КАМЕРЫ
==================================================
*/

document.getElementById(
  'cameraButton'
).addEventListener(
  'click',
  function() {

    if (
      cameraRunning
    ) {

      stopCamera();

    } else {

      startCamera();

    }

  }
);


/*
==================================================
ЗАКРЫТИЕ КАМЕРЫ
==================================================
*/

document.getElementById(
  'closeCameraButton'
).addEventListener(
  'click',
  function() {

    stopCamera();

  }
);


/*
==================================================
ОБНОВЛЕНИЕ БАЗЫ
==================================================
*/

document.getElementById(
  'updateButton'
).addEventListener(
  'click',
  function() {

    updateDatabase();

  }
);


/*
==================================================
ЗАПУСК ПРИЛОЖЕНИЯ
==================================================
*/

async function init() {

  const status =
    document.getElementById(
      'status'
    );


  /*
  Пытаемся взять локальную базу.
  */

  try {

    status.textContent =
      'Загружаем базу...';


    const saved =
      await loadDatabaseFromStorage();


    /*
    Локальная база найдена.
    */

    if (
      saved &&
      saved.products
    ) {

      /*
      Показываем её сразу.
      */

      setDatabase(
        saved
      );


      status.textContent =
        '';


      /*
      Проверяем обновление
      в фоне.
      */

      checkForNewVersion();


      return;

    }

  } catch (error) {

    console.error(
      'Ошибка IndexedDB:',
      error
    );

  }


  /*
  Локальной базы нет.
  */

  status.textContent =
    'Первая загрузка базы...';


  try {

    const data =
      await loadDatabaseFromServer();


    status.textContent =
      'Сохраняем базу...';


    await saveDatabase(
      data
    );


    setDatabase(
      data
    );


    status.textContent =
      '';


  } catch (error) {

    console.error(
      'Ошибка первой загрузки:',
      error
    );


    status.textContent =
      'Не удалось загрузить базу';

  }

}


/*
==================================================
СТАРТ
==================================================
*/

init();

</script>
