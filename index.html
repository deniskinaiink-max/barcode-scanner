<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>Сканер товара</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #000;
      color: #fff;
    }


    .container {
      max-width: 600px;
      margin: auto;
    }


    h1 {
      text-align: center;
      font-size: 27px;
      margin: 10px 0 25px;
    }


    button {
      width: 100%;
      padding: 18px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #000;
    }


    #reader {
      margin-top: 20px;
      border-radius: 15px;
      overflow: hidden;
    }


    #message {
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      font-size: 17px;
    }


    .card {
      margin-top: 25px;
      padding: 22px;
      border-radius: 20px;
      background: #181818;
    }


    .name {
      font-size: 25px;
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 25px;
    }


    .row {
      font-size: 18px;
      margin: 18px 0;
    }


    .value {
      display: block;
      font-size: 30px;
      font-weight: bold;
      margin-top: 5px;
    }


    .price {
      display: block;
      font-size: 30px;
      font-weight: bold;
      margin-top: 5px;
    }


    .updated {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid #333;
      color: #999;
      font-size: 14px;
      text-align: center;
    }


    .barcode {
      color: #666;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
    }


    .next {
      margin-top: 15px;
      font-size: 21px;
    }


    .error {
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      background: #222;
      color: #ff6b6b;
      font-size: 18px;
      text-align: center;
    }


    .hidden {
      display: none;
    }


    .loading {
      margin-top: 25px;
      text-align: center;
      font-size: 18px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>📦 Сканер товара</h1>


  <button
    id="start"
    type="button">

    📷 СКАНИРОВАТЬ ШТРИХКОД

  </button>


  <div id="reader"></div>


  <div id="message">

    Нажмите кнопку и наведите камеру
    на штрихкод

  </div>


  <div id="product"></div>


  <button
    id="next"
    class="next hidden"
    type="button">

    📷 СКАНИРОВАТЬ СЛЕДУЮЩИЙ

  </button>


</div>


<script>


const API_URL =
  'https://script.google.com/macros/s/AKfycbwLJNTns2VnOebnan30cDWpad1tZaTtjI2g8B44HP6oj0M806NbzsZLcgn_9XkO-pwL/exec';


let scanner = null;


const startButton =
  document.getElementById('start');


const nextButton =
  document.getElementById('next');


const reader =
  document.getElementById('reader');


const message =
  document.getElementById('message');


const product =
  document.getElementById('product');



function startScanner() {


  if (scanner) {
    return;
  }


  product.innerHTML = '';


  nextButton.classList.add('hidden');


  startButton.classList.add('hidden');


  message.innerHTML =
    '📷 Наведите камеру на штрихкод';


  scanner =
    new Html5Qrcode('reader');


  scanner.start(

    {
      facingMode: 'environment'
    },

    {

      fps: 10,

      qrbox: {
        width: 300,
        height: 150
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39

      ]

    },


    function(decodedText) {

      stopScanner();

      loadProduct(decodedText);

    },


    function() {}

  )


  .catch(function(error) {


    scanner = null;


    startButton.classList.remove('hidden');


    message.innerHTML =

      '<div class="error">' +

      'Не удалось включить камеру.' +

      '<br><br>' +

      error +

      '</div>';

  });

}



function stopScanner() {


  if (!scanner) {
    return;
  }


  scanner.stop()

    .then(function() {

      scanner.clear();

      scanner = null;

    })

    .catch(function() {

      scanner = null;

    });


  reader.innerHTML = '';

}



function loadProduct(barcode) {


  message.innerHTML =

    '<div class="loading">' +

    '🔄 Ищем товар...' +

    '</div>';


  // Имя функции, которую вызовет Apps Script

  const callbackName =
    'receiveProduct';


  // Если предыдущий запрос оставил callback

  window[callbackName] = function(data) {


    // Удаляем временный script

    const oldScript =
      document.getElementById(
        'apiScript'
      );


    if (oldScript) {
      oldScript.remove();
    }


    if (!data || !data.success) {


      product.innerHTML =

        '<div class="error">' +

        'Товар не найден' +

        '<br><br>' +

        'Штрихкод: ' +

        escapeHtml(barcode) +

        '</div>';

    }


    else {


      product.innerHTML =

        '<div class="card">' +


          '<div class="name">' +

            escapeHtml(data.name) +

          '</div>' +


          '<div class="row">' +

            '<b>Доступный остаток:</b>' +

            '<span class="value">' +

              escapeHtml(data.available) +

            '</span>' +

          '</div>' +


          '<div class="row">' +

            '<b>Остаток:</b>' +

            '<span class="value">' +

              escapeHtml(data.stock) +

            '</span>' +

          '</div>' +


          '<div class="row">' +

            '<b>Цена:</b>' +

            '<span class="price">' +

              escapeHtml(data.price) +

              ' ₽' +

            '</span>' +

          '</div>' +


          '<div class="updated">' +

            '🕐 Данные обновлены: ' +

            escapeHtml(data.updatedAt) +

          '</div>' +


          '<div class="barcode">' +

            'Штрихкод: ' +

            escapeHtml(data.barcode) +

          '</div>' +


        '</div>';

    }


    message.innerHTML = '';


    nextButton.classList.remove(
      'hidden'
    );

  };


  // Создаём script-запрос.
  // В отличие от fetch(), он не блокируется CORS.

  const script =
    document.createElement('script');


  script.id =
    'apiScript';


  script.src =

    API_URL +

    '?barcode=' +

    encodeURIComponent(barcode) +

    '&callback=' +

    callbackName;


  script.onerror = function() {


    script.remove();


    message.innerHTML =

      '<div class="error">' +

      'Не удалось получить данные.' +

      '<br><br>' +

      'Ошибка соединения с сервером' +

      '</div>';


    nextButton.classList.remove(
      'hidden'
    );

  };


  document.body.appendChild(script);

}



function escapeHtml(value) {


  return String(value ?? '')

    .replace(/&/g, '&amp;')

    .replace(/</g, '&lt;')

    .replace(/>/g, '&gt;')

    .replace(/"/g, '&quot;')

    .replace(/'/g, '&#039;');

}



startButton.onclick =
  startScanner;


nextButton.onclick =
  startScanner;


const params =
  new URLSearchParams(
    window.location.search
  );


if (params.get('scan') === '1') {


  setTimeout(

    startScanner,

    300

  );

}

</script>


</body>

</html>
