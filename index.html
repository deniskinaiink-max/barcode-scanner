<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Сканер товара</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 500px;
  margin: 0 auto;
}

h1 {
  font-size: 22px;
  margin: 0 0 8px;
}

.status {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 15px;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
  margin-top: 15px;
}

.result {
  margin-top: 20px;
  padding: 18px;
  background: #151515;
  border-radius: 12px;
  display: none;
}

.name {
  font-size: 20px;
  font-weight: bold;
  line-height: 1.3;
  margin-bottom: 15px;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 9px 0;
  border-bottom: 1px solid #292929;
}

.row:last-child {
  border-bottom: none;
}

.label {
  color: #999;
}

.value {
  text-align: right;
  font-weight: bold;
}

button {
  width: 100%;
  border: none;
  border-radius: 10px;
  padding: 15px;
  margin-top: 12px;
  font-size: 16px;
  font-weight: bold;
  background: #fff;
  color: #000;
  cursor: pointer;
}

button:active {
  opacity: 0.7;
}

button:disabled {
  opacity: 0.5;
}

.secondary {
  background: #222;
  color: #fff;
  border: 1px solid #444;
}

.danger {
  background: #222;
  color: #aaa;
  border: 1px solid #444;
}

.database {
  margin-top: 15px;
  color: #777;
  font-size: 12px;
  text-align: center;
  line-height: 1.5;
}

.error {
  margin-top: 15px;
  padding: 14px;
  border-radius: 10px;
  background: #1c1c1c;
  color: #aaa;
  display: none;
  white-space: pre-line;
}

.cameraButtons {
  display: none;
}

</style>

</head>


<body>

<div class="container">

<h1>📦 Сканер товара</h1>

<div id="status" class="status">
Проверяем локальную базу...
</div>


<div id="reader"></div>


<div id="cameraButtons" class="cameraButtons">

<button
  id="startCameraButton"
  onclick="startCamera()"
>
📷 Включить камеру
</button>

<button
  id="stopCameraButton"
  class="danger"
  onclick="stopCamera()"
  style="display:none;"
>
⏹ Выключить камеру
</button>

</div>


<div id="error" class="error"></div>


<div id="result" class="result">

<div id="productName" class="name"></div>


<div class="row">

<div class="label">
Штрихкод
</div>

<div id="productBarcode" class="value"></div>

</div>


<div class="row">

<div class="label">
Доступный остаток
</div>

<div id="productAvailable" class="value"></div>

</div>


<div class="row">

<div class="label">
Остаток
</div>

<div id="productStock" class="value"></div>

</div>


<div class="row">

<div class="label">
Цена
</div>

<div id="productPrice" class="value"></div>

</div>


<button
onclick="scanNext()"
>
📷 Сканировать следующий
</button>


</div>


<button
id="refreshButton"
class="secondary"
onclick="updateDatabase()"
style="display:none;"
>
Обновить базу
</button>


<div
id="databaseInfo"
class="database"
>
</div>


</div>


<script>


// =====================================================
// НАСТРОЙКИ
// =====================================================

const API_URL =
'https://script.google.com/macros/s/AKfycbwLJNTns2VnOebnan30cDWpad1tZaTtjI2g8B44HP6oj0M806NbzsZLcgn_9XkO-pwL/exec';


const STORAGE_KEY =
'SCANINK_DATABASE_V3';


// =====================================================
// ПЕРЕМЕННЫЕ
// =====================================================

let products = {};

let databaseData = null;

let scanner = null;

let scannerRunning = false;

let scannerLibraryLoaded = false;


// =====================================================
// DOM
// =====================================================

const statusElement =
document.getElementById('status');

const resultElement =
document.getElementById('result');

const errorElement =
document.getElementById('error');

const databaseInfoElement =
document.getElementById('databaseInfo');

const refreshButton =
document.getElementById('refreshButton');

const cameraButtons =
document.getElementById('cameraButtons');

const startCameraButton =
document.getElementById('startCameraButton');

const stopCameraButton =
document.getElementById('stopCameraButton');


// =====================================================
// ЗАГРУЗКА БИБЛИОТЕКИ КАМЕРЫ
// =====================================================

function loadScannerLibrary() {

return new Promise((resolve, reject) => {

const sources = [

'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',

'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'

];


let index = 0;


function tryNext() {

if (index >= sources.length) {

reject(
new Error(
'Не удалось загрузить библиотеку камеры'
)
);

return;

}


const script =
document.createElement('script');


script.src =
sources[index++];


script.onload =
function() {

if (
typeof Html5Qrcode !==
'undefined'
) {

scannerLibraryLoaded =
true;

resolve();

}
else {

tryNext();

}

};


script.onerror =
function() {

tryNext();

};


document.head.appendChild(
script
);

}


tryNext();

});

}


// =====================================================
// ЗАПУСК ПРИЛОЖЕНИЯ
// =====================================================

async function init() {

try {


// -----------------------------------------------------
// Сначала пытаемся взять локальную базу
// -----------------------------------------------------

const saved =
localStorage.getItem(
STORAGE_KEY
);


if (saved) {

try {

databaseData =
JSON.parse(saved);

products =
databaseData.products || {};


showDatabaseInfo(
databaseData
);


statusElement.textContent =
'База загружена. Можно сканировать.';


refreshButton.style.display =
'block';


cameraButtons.style.display =
'block';


return;

}
catch (error) {

console.log(
'Локальная база повреждена.'
);

localStorage.removeItem(
STORAGE_KEY
);

}

}


// -----------------------------------------------------
// Если базы нет — загружаем
// -----------------------------------------------------

statusElement.textContent =
'Загружаем актуальную базу...';


await updateDatabase();


}
catch (error) {

console.error(error);

showError(
'Ошибка запуска: ' +
error.message
);

}

}


// =====================================================
// ЗАГРУЗКА БАЗЫ С СЕРВЕРА
// =====================================================

function loadDatabaseFromServer() {

return new Promise((resolve, reject) => {

const callbackName =
'receiveScanInkDatabase_' +
Date.now();


const script =
document.createElement('script');


window[callbackName] =
function(data) {

delete window[callbackName];

script.remove();

resolve(data);

};


script.src =
API_URL +
'?mode=database' +
'&callback=' +
callbackName +
'&v=' +
Date.now();


script.onerror =
function() {

delete window[callbackName];

script.remove();

reject(
new Error(
'Не удалось загрузить базу'
)
);

};


document.body.appendChild(
script
);

});

}


// =====================================================
// ОБНОВЛЕНИЕ БАЗЫ
// =====================================================

async function updateDatabase() {

try {

refreshButton.disabled =
true;


statusElement.textContent =
'Загружаем актуальную базу...';


hideError();


const data =
await loadDatabaseFromServer();


if (
!data ||
!data.products
) {

throw new Error(
'Сервер вернул некорректную базу'
);

}


databaseData =
data;


products =
data.products;


// -----------------------------------------------------
// Сохраняем локально
// -----------------------------------------------------

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);


showDatabaseInfo(
data
);


statusElement.textContent =
'База загружена. Можно сканировать.';


refreshButton.style.display =
'block';


cameraButtons.style.display =
'block';


}
catch (error) {

console.error(error);

showError(
'Ошибка обновления базы: ' +
error.message
);


statusElement.textContent =
'База не обновилась.';


}
finally {

refreshButton.disabled =
false;

}

}


// =====================================================
// ИНФОРМАЦИЯ О БАЗЕ
// =====================================================

function showDatabaseInfo(data) {

const count =
data.count ||
Object.keys(
data.products || {}
).length;


let dateText =
'неизвестно';


if (data.updatedAt) {

const date =
new Date(
data.updatedAt
);


if (!isNaN(date.getTime())) {

dateText =
date.toLocaleString(
'ru-RU'
);

}

}


databaseInfoElement.innerHTML =
'Товаров: ' +
count +
'<br>' +
'База обновлена: ' +
dateText;

}


// =====================================================
// ВКЛЮЧЕНИЕ КАМЕРЫ
// =====================================================

async function startCamera() {

hideError();


if (scannerRunning) {
return;
}


try {


// -----------------------------------------------------
// Загружаем библиотеку только сейчас
// -----------------------------------------------------

if (!scannerLibraryLoaded) {

statusElement.textContent =
'Запускаем камеру...';


await loadScannerLibrary();

}


// -----------------------------------------------------
// Создаём сканер
// -----------------------------------------------------

if (!scanner) {

scanner =
new Html5Qrcode(
'reader'
);

}


// -----------------------------------------------------
// Запускаем камеру
// -----------------------------------------------------

await scanner.start(

{
facingMode:
'environment'
},

{
fps: 10,

qrbox: {
width: 280,
height: 140
},

aspectRatio: 1.7777778

},

onScanSuccess,

function(error) {

// Ничего не делаем.
// Пока штрихкод не найден — это нормально.

}

);


scannerRunning =
true;


startCameraButton.style.display =
'none';


stopCameraButton.style.display =
'block';


statusElement.textContent =
'Наведите камеру на штрихкод';


}
catch (error) {

console.error(error);

showError(
'Не удалось запустить камеру: ' +
error.message
);

}

}


// =====================================================
// ВЫКЛЮЧЕНИЕ КАМЕРЫ
// =====================================================

async function stopCamera() {

if (
!scanner ||
!scannerRunning
) {
return;
}


try {

await scanner.stop();

scannerRunning =
false;


startCameraButton.style.display =
'block';


stopCameraButton.style.display =
'none';


statusElement.textContent =
'Камера выключена.';


}
catch (error) {

console.error(error);

}

}


// =====================================================
// УСПЕШНОЕ СКАНИРОВАНИЕ
// =====================================================

async function onScanSuccess(
decodedText
) {

if (!scannerRunning) {
return;
}


const barcode =
String(
decodedText
).trim();


console.log(
'Штрихкод:',
barcode
);


// -----------------------------------------------------
// Останавливаем камеру
// -----------------------------------------------------

try {

await scanner.stop();

}
catch (error) {

console.log(error);

}


scannerRunning =
false;


startCameraButton.style.display =
'none';


stopCameraButton.style.display =
'none';


// -----------------------------------------------------
// Ищем товар в памяти
// -----------------------------------------------------

const product =
products[barcode];


if (product) {

showProduct(
product
);

statusElement.textContent =
'Товар найден.';

}
else {

showError(
'Товар не найден\n\n' +
'Штрихкод: ' +
barcode
);

resultElement.style.display =
'none';

statusElement.textContent =
'Товар не найден.';

}

}


// =====================================================
// ПОКАЗ ТОВАРА
// =====================================================

function showProduct(product) {

hideError();


document.getElementById(
'productName'
).textContent =
product.name || 'Без названия';


document.getElementById(
'productBarcode'
).textContent =
product.barcode || '';


document.getElementById(
'productAvailable'
).textContent =
product.available || '0';


document.getElementById(
'productStock'
).textContent =
product.stock || '0';


document.getElementById(
'productPrice'
).textContent =
product.price
? product.price + ' ₽'
: '0 ₽';


resultElement.style.display =
'block';

}


// =====================================================
// СКАНИРОВАТЬ СЛЕДУЮЩИЙ
// =====================================================

async function scanNext() {

hideError();


resultElement.style.display =
'none';


await startCamera();

}


// =====================================================
// ОШИБКИ
// =====================================================

function showError(message) {

errorElement.textContent =
message;

errorElement.style.display =
'block';

}


function hideError() {

errorElement.style.display =
'none';

}


// =====================================================
// СТАРТ
// =====================================================

init();

</script>

</body>
</html>
