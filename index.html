<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Стройцентр Инком — Сканер</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    .status {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #151515;
      border-radius: 12px;
      display: none;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 9px 0;
      border-bottom: 1px solid #292929;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      color: #999;
    }

    .value {
      text-align: right;
      font-weight: bold;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      background: #fff;
      color: #000;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    .secondary {
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }

    .database {
      margin-top: 15px;
      color: #777;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    .error {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #1c1c1c;
      color: #aaa;
      display: none;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Сканер товара</h1>

  <div id="status" class="status">
    Проверяем локальную базу...
  </div>

  <div id="reader"></div>

  <div id="error" class="error"></div>

  <div id="result" class="result">

    <div id="productName" class="name"></div>

    <div class="row">
      <div class="label">Штрихкод</div>
      <div id="productBarcode" class="value"></div>
    </div>

    <div class="row">
      <div class="label">Доступный остаток</div>
      <div id="productAvailable" class="value"></div>
    </div>

    <div class="row">
      <div class="label">Остаток</div>
      <div id="productStock" class="value"></div>
    </div>

    <div class="row">
      <div class="label">Цена</div>
      <div id="productPrice" class="value"></div>
    </div>

    <button onclick="scanNext()">
      Сканировать следующий
    </button>

  </div>

  <button
    id="refreshButton"
    class="secondary"
    onclick="updateDatabase()"
    style="display:none;"
  >
    Обновить базу
  </button>

  <div id="databaseInfo" class="database"></div>

</div>


<script>

// =====================================================
// НАСТРОЙКИ
// =====================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbwLJNTns2VnOebnan30cDWpad1tZaTtjI2g8B44HP6oj0M806NbzsZLcgn_9XkO-pwL/exec';


// =====================================================
// ЛОКАЛЬНАЯ БАЗА
// =====================================================

const DB_NAME = 'ScanInkDatabase';

const DB_VERSION = 2;

const STORE_NAME = 'database';

let database = null;

let products = {};

let scanner = null;

let scannerRunning = false;


// =====================================================
// DOM
// =====================================================

const statusElement =
  document.getElementById('status');

const resultElement =
  document.getElementById('result');

const errorElement =
  document.getElementById('error');

const databaseInfoElement =
  document.getElementById('databaseInfo');

const refreshButton =
  document.getElementById('refreshButton');


// =====================================================
// INDEXED DB
// =====================================================

function openDatabase() {

  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded =
      function(event) {

        const db =
          event.target.result;

        if (
          !db.objectStoreNames.contains(
            STORE_NAME
          )
        ) {

          db.createObjectStore(
            STORE_NAME
          );

        }

      };


    request.onsuccess =
      function(event) {

        resolve(
          event.target.result
        );

      };


    request.onerror =
      function() {

        reject(
          request.error
        );

      };

  });

}


// =====================================================
// ПОЛУЧИТЬ ЛОКАЛЬНУЮ БАЗУ
// =====================================================

function getLocalDatabase(db) {

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        STORE_NAME,
        'readonly'
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );

    const request =
      store.get('products');


    request.onsuccess =
      function() {

        resolve(
          request.result || null
        );

      };


    request.onerror =
      function() {

        reject(
          request.error
        );

      };

  });

}


// =====================================================
// СОХРАНИТЬ БАЗУ
// =====================================================

function saveLocalDatabase(
  db,
  data
) {

  return new Promise((resolve, reject) => {

    const transaction =
      db.transaction(
        STORE_NAME,
        'readwrite'
      );

    const store =
      transaction.objectStore(
        STORE_NAME
      );


    const request =
      store.put(
        data,
        'products'
      );


    request.onsuccess =
      function() {

        resolve();

      };


    request.onerror =
      function() {

        reject(
          request.error
        );

      };

  });

}


// =====================================================
// ЗАПУСК
// =====================================================

async function init() {

  try {

    database =
      await openDatabase();


    const localData =
      await getLocalDatabase(
        database
      );


    if (localData) {

      console.log(
        'Найдена локальная база:',
        localData
      );


      products =
        localData.products || {};


      showDatabaseInfo(
        localData
      );


      statusElement.textContent =
        'База загружена. Можно сканировать.';


      refreshButton.style.display =
        'block';


      startScanner();


    } else {

      statusElement.textContent =
        'Локальной базы нет. Загружаем базу...';


      await updateDatabase(
        false
      );

    }


  } catch (error) {

    console.error(error);

    showError(
      'Не удалось открыть локальную базу: ' +
      error.message
    );

  }

}


// =====================================================
// ЗАГРУЗКА JSON-БАЗЫ
// =====================================================

function loadDatabaseFromServer() {

  return new Promise((resolve, reject) => {

    const callbackName =
      'receiveScanInkDatabase_' +
      Date.now();


    window[callbackName] =
      function(data) {

        try {

          delete window[callbackName];

          script.remove();

          resolve(data);

        } catch (error) {

          reject(error);

        }

      };


    const script =
      document.createElement(
        'script'
      );


    script.src =
      API_URL +
      '?mode=database' +
      '&callback=' +
      callbackName;


    script.onerror =
      function() {

        delete window[callbackName];

        script.remove();

        reject(
          new Error(
            'Не удалось загрузить базу'
          )
        );

      };


    document.body.appendChild(
      script
    );

  });

}


// =====================================================
// ОБНОВИТЬ БАЗУ
// =====================================================

async function updateDatabase(
  showMessage = true
) {

  try {

    refreshButton.disabled =
      true;


    statusElement.textContent =
      'Загружаем актуальную базу...';


    if (showMessage) {

      resultElement.style.display =
        'none';

    }


    const data =
      await loadDatabaseFromServer();


    if (
      !data ||
      !data.products
    ) {

      throw new Error(
        'Сервер вернул некорректную базу'
      );

    }


    products =
      data.products;


    await saveLocalDatabase(
      database,
      data
    );


    showDatabaseInfo(
      data
    );


    statusElement.textContent =
      'База актуальна. Можно сканировать.';


    refreshButton.style.display =
      'block';


    if (!scannerRunning) {

      await startScanner();

    }


  } catch (error) {

    console.error(error);

    showError(
      'Ошибка обновления базы: ' +
      error.message
    );


    statusElement.textContent =
      'Не удалось обновить базу.';


  } finally {

    refreshButton.disabled =
      false;

  }

}


// =====================================================
// ИНФОРМАЦИЯ О БАЗЕ
// =====================================================

function showDatabaseInfo(
  data
) {

  const count =
    data.count ||
    Object.keys(
      data.products || {}
    ).length;


  let dateText =
    'неизвестно';


  if (data.updatedAt) {

    const date =
      new Date(
        data.updatedAt
      );


    if (!isNaN(date.getTime())) {

      dateText =
        date.toLocaleString(
          'ru-RU'
        );

    }

  }


  databaseInfoElement.innerHTML =
    'Товаров: ' +
    count +
    '<br>' +
    'База обновлена: ' +
    dateText;

}


// =====================================================
// СКАНЕР
// =====================================================

async function startScanner() {

  if (scannerRunning) {
    return;
  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  try {

    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 140
        },

        aspectRatio: 1.7777778

      },

      onScanSuccess,

      onScanFailure

    );


    scannerRunning =
      true;


  } catch (error) {

    console.error(error);

    showError(
      'Не удалось запустить камеру: ' +
      error.message
    );

  }

}


// =====================================================
// УСПЕШНОЕ СКАНИРОВАНИЕ
// =====================================================

async function onScanSuccess(
  decodedText
) {

  if (!scannerRunning) {
    return;
  }


  const barcode =
    String(
      decodedText
    ).trim();


  console.log(
    'Отсканирован:',
    barcode
  );


  // ---------------------------------------------------
  // Останавливаем камеру
  // ---------------------------------------------------

  try {

    await scanner.pause(
      true
    );

  } catch (error) {

    console.log(
      'Pause error:',
      error
    );

  }


  scannerRunning =
    false;


  // ---------------------------------------------------
  // Ищем товар ТОЛЬКО В ЛОКАЛЬНОЙ БАЗЕ
  // ---------------------------------------------------

  const product =
    products[barcode];


  if (product) {

    showProduct(
      product
    );

  } else {

    showError(
      'Товар со штрихкодом ' +
      barcode +
      ' не найден в базе.'
    );

    resultElement.style.display =
      'none';

  }

}


// =====================================================
// ОШИБКИ СКАНИРОВАНИЯ
// =====================================================

function onScanFailure(
  error
) {

  // Ничего не делаем.
  // Это нормальная ситуация,
  // пока камера ищет штрихкод.

}


// =====================================================
// ПОКАЗАТЬ ТОВАР
// =====================================================

function showProduct(
  product
) {

  hideError();


  document.getElementById(
    'productName'
  ).textContent =
    product.name || 'Без названия';


  document.getElementById(
    'productBarcode'
  ).textContent =
    product.barcode || '';


  document.getElementById(
    'productAvailable'
  ).textContent =
    product.available || '0';


  document.getElementById(
    'productStock'
  ).textContent =
    product.stock || '0';


  document.getElementById(
    'productPrice'
  ).textContent =
    product.price
      ? product.price + ' ₽'
      : '0 ₽';


  resultElement.style.display =
    'block';

}


// =====================================================
// СКАНИРОВАТЬ СЛЕДУЮЩИЙ
// =====================================================

async function scanNext() {

  hideError();


  resultElement.style.display =
    'none';


  statusElement.textContent =
    'Наведите камеру на штрихкод';


  if (
    scanner &&
    !scannerRunning
  ) {

    try {

      await scanner.resume();

      scannerRunning =
        true;

    } catch (error) {

      console.error(error);

      // Если resume не сработал,
      // запускаем сканер заново.

      try {

        scanner.clear();

      } catch (e) {}


      scanner =
        null;


      await startScanner();

    }

  } else if (!scanner) {

    await startScanner();

  }

}


// =====================================================
// ОШИБКА
// =====================================================

function showError(
  message
) {

  errorElement.textContent =
    message;

  errorElement.style.display =
    'block';

}


// =====================================================
// СКРЫТЬ ОШИБКУ
// =====================================================

function hideError() {

  errorElement.style.display =
    'none';

}


// =====================================================
// СТАРТ
// =====================================================

init();

</script>

</body>
</html>
