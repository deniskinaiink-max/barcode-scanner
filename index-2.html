<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
>

<title>Стройцентр Инком — Проверка товара</title>


<style>
:root {
  --brand-lime: rgb(196, 230, 44);
  --brand-dark: rgb(36, 38, 35);
  --bg: #f3f4f1;
  --surface: #ffffff;
  --surface-soft: #f8f9f6;
  --text: #242623;
  --muted: #74786f;
  --border: #e2e5dc;
  --shadow: 0 10px 30px rgba(36, 38, 35, .08);
  --shadow-soft: 0 4px 16px rgba(36, 38, 35, .06);
  --radius: 20px;
}

* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background:
    radial-gradient(circle at 90% 0%, rgba(196,230,44,.16), transparent 28%),
    var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; }

.container {
  width: min(100%, 720px);
  margin: 0 auto;
  padding: 18px 16px 34px;
}

.header {
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
  padding: 22px 22px 20px;
  border-radius: 24px;
  background: var(--brand-dark);
  color: #fff;
  box-shadow: var(--shadow);
}

.header::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  right: -45px;
  top: -55px;
  border-radius: 50%;
  background: var(--brand-lime);
  opacity: .95;
}

.header::before {
  content: "";
  position: absolute;
  width: 90px;
  height: 90px;
  right: 55px;
  bottom: -55px;
  border-radius: 50%;
  border: 20px solid rgba(196,230,44,.18);
}

.company,
.title { position: relative; z-index: 1; }

.company {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--brand-lime);
}

.company::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--brand-lime);
}

.title {
  margin-top: 9px;
  font-size: clamp(26px, 7vw, 34px);
  line-height: 1.05;
  font-weight: 800;
  letter-spacing: -.035em;
}

.search-row {
  display: flex;
  gap: 9px;
  margin-bottom: 10px;
}

.search-input {
  flex: 1;
  min-width: 0;
  height: 56px;
  padding: 0 17px;
  border: 1px solid var(--border);
  border-radius: 17px;
  outline: none;
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  box-shadow: var(--shadow-soft);
  transition: border-color .18s, box-shadow .18s, transform .18s;
}

.search-input::placeholder { color: #9a9e96; }

.search-input:focus {
  border-color: var(--brand-lime);
  box-shadow: 0 0 0 4px rgba(196,230,44,.22), var(--shadow-soft);
}

.button {
  height: 56px;
  border: 0;
  border-radius: 17px;
  padding: 0 17px;
  font-size: 15px;
  font-weight: 750;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, opacity .15s;
  -webkit-tap-highlight-color: transparent;
}

.button:active { transform: scale(.98); }

.camera-button {
  flex: 0 0 56px;
  padding: 0;
  background: var(--brand-dark);
  color: #fff;
  box-shadow: var(--shadow-soft);
  font-size: 22px;
}

.camera-button:hover,
.next-button:hover { box-shadow: 0 8px 20px rgba(36,38,35,.18); }

.stock-filter {
  margin-bottom: 10px;
  padding: 15px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: rgba(255,255,255,.9);
  box-shadow: var(--shadow-soft);
}

.stock-filter-row {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.stock-filter-label {
  font-size: 14px;
  font-weight: 650;
}

.stock-filter input[type="checkbox"] {
  width: 20px;
  height: 20px;
  margin: 0 2px 0 0;
  accent-color: var(--brand-lime);
}

.stock-filter input[type="number"],
.stock-filter select {
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  background: var(--surface-soft);
  color: var(--text);
  font-size: 15px;
  transition: border-color .18s, box-shadow .18s;
}

.stock-filter input[type="number"] {
  width: 90px;
  padding: 0 11px;
}

.stock-filter select {
  min-width: 86px;
  padding: 0 30px 0 11px;
}

.stock-filter input[type="number"]:focus,
.stock-filter select:focus {
  border-color: var(--brand-lime);
  box-shadow: 0 0 0 3px rgba(196,230,44,.18);
}

.stock-filter-hint {
  margin-top: 8px;
  font-size: 12px;
  line-height: 1.35;
  color: var(--muted);
}

#reader {
  display: none;
  width: 100%;
  margin-top: 12px;
  overflow: hidden;
  border-radius: 20px;
  background: #000;
  box-shadow: var(--shadow);
}

.camera-controls {
  display: none;
  margin-top: 8px;
  gap: 8px;
}

.camera-controls button { flex: 1; }

.status {
  min-height: 22px;
  margin: 9px 3px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.results { margin-top: 12px; }

.card {
  position: relative;
  overflow: hidden;
  margin-bottom: 12px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: var(--brand-lime);
}

.product-name {
  margin-bottom: 12px;
  padding-right: 4px;
  font-size: 20px;
  line-height: 1.25;
  font-weight: 800;
  letter-spacing: -.02em;
}

.meta {
  margin-top: 5px;
  font-size: 13px;
  line-height: 1.35;
  color: var(--muted);
}

.stock-label {
  margin-top: 19px;
  font-size: 12px;
  line-height: 1.2;
  font-weight: 750;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--muted);
}

.stock-main {
  margin-top: 5px;
  font-size: clamp(36px, 10vw, 48px);
  line-height: .98;
  font-weight: 850;
  letter-spacing: -.045em;
  color: var(--brand-dark);
}

.stock-total {
  margin-top: 9px;
  font-size: 14px;
  font-weight: 600;
  color: #60655d;
}

.price {
  margin-top: 17px;
  font-size: clamp(27px, 7vw, 34px);
  line-height: 1;
  font-weight: 850;
  letter-spacing: -.04em;
  color: var(--brand-dark);
}

.next-button {
  width: 100%;
  margin-top: 18px;
  background: var(--brand-dark);
  color: #fff;
  box-shadow: 0 5px 14px rgba(36,38,35,.12);
}

.next-button::after {
  content: "  →";
  color: var(--brand-lime);
}

.update-button {
  width: 100%;
  margin-top: 12px;
  background: var(--brand-lime);
  color: var(--brand-dark);
  box-shadow: var(--shadow-soft);
}

.update-button:hover { box-shadow: 0 8px 20px rgba(36,38,35,.12); }

.update-button.loading { opacity: .55; }

.no-results {
  padding: 34px 12px;
  text-align: center;
  color: var(--muted);
  font-size: 15px;
}

.footer {
  margin-top: 22px;
  padding: 12px 8px 0;
  text-align: center;
  font-size: 11px;
  line-height: 1.55;
  color: #92968e;
}

.db-info { margin-top: 5px; }

@media (max-width: 480px) {
  .container { padding: 12px 12px 28px; }
  .header { padding: 20px 18px 18px; border-radius: 21px; }
  .search-row { gap: 7px; }
  .search-input { height: 54px; }
  .camera-button { flex-basis: 54px; height: 54px; }
  .stock-filter { padding: 13px; }
  .stock-filter-row { gap: 8px; }
  .stock-filter input[type="number"] { width: 82px; }
  .card { padding: 18px; border-radius: 20px; }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161815;
    --surface: #22251f;
    --surface-soft: #292c26;
    --text: #f4f5f1;
    --muted: #a8aca2;
    --border: #383c34;
    --shadow: 0 12px 32px rgba(0,0,0,.24);
    --shadow-soft: 0 5px 18px rgba(0,0,0,.18);
  }

  body {
    background:
      radial-gradient(circle at 90% 0%, rgba(196,230,44,.10), transparent 28%),
      var(--bg);
  }

  .search-input,
  .stock-filter { background: var(--surface); }

  .stock-filter input[type="number"],
  .stock-filter select { background: var(--surface-soft); }

  .stock-main,
  .price { color: var(--brand-lime); }

  .stock-total { color: #b5b9ae; }
}
</style>

</head>


<body>


<div class="container">


  <div class="header">

    <div class="company">
      СТРОЙЦЕНТР ИНКОМ
    </div>

    <div class="title">
      Проверка товара
    </div>

  </div>


  <div class="search-row">


    <input

      id="searchInput"

      class="search-input"

      type="text"

      autocomplete="off"

      autocorrect="off"

      autocapitalize="off"

      spellcheck="false"

      placeholder="Штрихкод, код 1С или название"

    >


    <button

      id="cameraButton"

      class="button camera-button"

    >
      📷
    </button>


  </div>


  <div class="stock-filter">

    <div class="stock-filter-row">

      <input
        id="stockFilterEnabled"
        type="checkbox"
      >

      <label
        class="stock-filter-label"
        for="stockFilterEnabled"
      >
        Показывать только товары с остатком
      </label>

    </div>


    <div
      class="stock-filter-row"
      style="margin-top: 8px;"
    >

      <span class="stock-filter-label">
        Кол-во от
      </span>

      <input
        id="stockFilterQuantity"
        type="number"
        min="0"
        step="any"
        inputmode="decimal"
        placeholder=""
      >

      <select id="stockFilterUnit">
        <option value="pcs">шт.</option>
        <option value="m2">м²</option>
      </select>

    </div>


    <div
      id="stockFilterHint"
      class="stock-filter-hint"
    ></div>

  </div>


  <div id="reader"></div>


  <div
    id="cameraControls"
    class="camera-controls"
  >

    <button

      id="closeCameraButton"

      class="button update-button"

    >
      Закрыть камеру
    </button>

  </div>


  <div
    id="status"
    class="status"
  ></div>


  <div
    id="results"
    class="results"
  ></div>


  <button

    id="updateButton"

    class="button update-button"

  >
    Обновить базу

  </button>


  <div class="footer">

    <div id="dbCount"></div>

    <div
      id="dbInfo"
      class="db-info"
    ></div>

  </div>


</div>


<script>


/*
==================================================
НАСТРОЙКИ
==================================================
*/


const API_URL =
  'https://script.google.com/macros/s/AKfycbwLJNTns2VnOebnan30cDWpad1tZaTtjI2g8B44HP6oj0M806NbzsZLcgn_9XkO-pwL/exec';


/*
Новая локальная база.

Старая база V1 полностью игнорируется.
*/

const DB_NAME =
  'ScanInkDatabaseV2';


const DB_VERSION =
  1;


const STORE_NAME =
  'database';


const DB_KEY =
  'current';


let databaseData =
  null;


let products =
  {};


let html5QrCode =
  null;


let cameraRunning =
  false;


let stockFilterEnabled =
  false;

let stockFilterQuantity =
  '';

let stockFilterUnit =
  'pcs';


/*
==================================================
INDEXED DB
==================================================
*/


function openDatabase() {

  return new Promise(
    (resolve, reject) => {


      if (!window.indexedDB) {

        reject(
          new Error(
            'IndexedDB не поддерживается'
          )
        );

        return;

      }


      const request =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      request.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(STORE_NAME)
          ) {

            db.createObjectStore(
              STORE_NAME
            );

          }

        };


      request.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      request.onerror =
        function(event) {

          reject(
            event.target.error ||
            new Error(
              'Ошибка открытия IndexedDB'
            )
          );

        };

    }
  );

}


/*
==================================================
СОХРАНЕНИЕ БАЗЫ
==================================================
*/


async function saveDatabase(data) {

  const db =
    await openDatabase();


  return new Promise(
    (resolve, reject) => {


      const transaction =
        db.transaction(
          STORE_NAME,
          'readwrite'
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.put(
          data,
          DB_KEY
        );


      request.onerror =
        function(event) {

          db.close();

          reject(
            event.target.error ||
            new Error(
              'Не удалось сохранить базу'
            )
          );

        };


      transaction.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaction.onerror =
        function(event) {

          db.close();

          reject(
            event.target.error ||
            new Error(
              'Ошибка записи IndexedDB'
            )
          );

        };

    }
  );

}


/*
==================================================
ЗАГРУЗКА ЛОКАЛЬНОЙ БАЗЫ
==================================================
*/


async function loadDatabaseFromStorage() {

  const db =
    await openDatabase();


  return new Promise(
    (resolve, reject) => {


      const transaction =
        db.transaction(
          STORE_NAME,
          'readonly'
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.get(DB_KEY);


      request.onsuccess =
        function(event) {

          const data =
            event.target.result ||
            null;


          db.close();


          resolve(data);

        };


      request.onerror =
        function(event) {

          db.close();


          reject(
            event.target.error ||
            new Error(
              'Не удалось прочитать базу'
            )
          );

        };

    }
  );

}


/*
==================================================
JSONP
==================================================

Используем JSONP ТОЛЬКО для
маленького запроса версии.

Большую базу через JSONP больше
не качаем.
==================================================
*/


function jsonp(url) {

  return new Promise(
    (resolve, reject) => {


      const callbackName =
        'scanInkCallback_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                'Истекло время ожидания'
              )
            );

          },
          30000
        );


      function cleanup() {

        clearTimeout(timeout);


        script.remove();


        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] = undefined;

        }

      }


      window[callbackName] =
        function(data) {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          resolve(data);

        };


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          cleanup();


          reject(
            new Error(
              'Ошибка JSONP'
            )
          );

        };


      script.src =
        url +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


/*
==================================================
ПОЛУЧЕНИЕ ВЕРСИИ СЕРВЕРА
==================================================
*/


async function getServerVersion() {

  const url =
    API_URL +
    '?mode=version&_=' +
    Date.now();


  return await jsonp(url);

}


/*
==================================================
ПОЛУЧЕНИЕ ПОЛНОЙ БАЗЫ
==================================================

Здесь используем fetch.

Это ключевое изменение.
==================================================
*/


async function loadDatabaseFromServer() {

  const url =
    API_URL +
    '?mode=database&_=' +
    Date.now();


  const response =
    await fetch(
      url,
      {
        method: 'GET',
        cache: 'no-store'
      }
    );


  if (!response.ok) {

    throw new Error(
      'Сервер вернул HTTP ' +
      response.status
    );

  }


  const data =
    await response.json();


  if (
    !data ||
    !data.products
  ) {

    throw new Error(
      'Сервер вернул некорректную базу'
    );

  }


  return data;

}


/*
==================================================
УСТАНОВКА БАЗЫ В ПАМЯТЬ
==================================================
*/


function setDatabase(data) {

  databaseData =
    data;


  products =
    data.products || {};


  document.getElementById(
    'dbCount'
  ).textContent =
    'Товаров в базе: ' +
    Number(
      data.count || 0
    ).toLocaleString(
      'ru-RU'
    );


  let updatedText =
    '';


  if (data.updatedAt) {

    try {

      const date =
        new Date(
          data.updatedAt
        );


      updatedText =
        date.toLocaleString(
          'ru-RU',
          {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          }
        );

    } catch (e) {

      updatedText =
        String(
          data.updatedAt
        );

    }

  }


  document.getElementById(
    'dbInfo'
  ).textContent =
    'Версия: ' +
    String(
      data.version || '—'
    ) +
    (
      updatedText
        ? ' · Обновлено: ' +
          updatedText
        : ''
    );

}


/*
==================================================
НОРМАЛИЗАЦИЯ КОДА 1С
==================================================
*/


function normalizeCode(value) {

  const digits =
    String(
      value || ''
    )
      .replace(
        /\D/g,
        ''
      );


  if (!digits) {

    return '';

  }


  return (
    digits.replace(
      /^0+/,
      ''
    ) ||
    '0'
  );

}


/*
==================================================
ПОИСК
==================================================
*/


function parseQuantity(value) {

  const normalized =
    String(value || '')
      .replace(/\u00a0/g, '')
      .replace(/\s/g, '')
      .replace(',', '.');

  const number =
    parseFloat(normalized.replace(/[^0-9.-]/g, ''));

  return Number.isFinite(number)
    ? number
    : 0;

}


function isM2Product(product) {

  return String(product.m2 || '')
    .trim()
    .toLowerCase() === 'да';

}


function applyStockFilter(results) {

  if (!stockFilterEnabled) {

    return results;

  }

  const quantityText =
    String(stockFilterQuantity || '').trim();

  const minimum =
    quantityText === ''
      ? 0
      : parseQuantity(quantityText);

  return results.filter(
    function(product) {

      const productIsM2 =
        isM2Product(product);

      if (
        stockFilterUnit === 'm2' &&
        !productIsM2
      ) {
        return false;
      }

      const quantity =
        stockFilterUnit === 'm2'
          ? parseQuantity(product.stockM2)
          : parseQuantity(product.stock);

      if (quantityText === '') {
        return quantity > 0;
      }

      return quantity >= minimum;

    }
  );

}


function updateStockFilterHint() {

  const hint =
    document.getElementById('stockFilterHint');

  if (!hint) return;

  if (!stockFilterEnabled) {

    hint.textContent = '';
    return;

  }

  if (stockFilterUnit === 'm2') {

    hint.textContent =
      'Ищем только товары с признаком м² = «Да» и проверяем остаток в колонке H — «Остаток в м²».';

  } else {

    hint.textContent =
      'Ищем по всей таблице и проверяем остаток в колонке G — «Остаток в ед. изм.», в шт.';

  }

}


function updateStockFilterFromControls() {

  stockFilterEnabled =
    document.getElementById(
      'stockFilterEnabled'
    ).checked;

  stockFilterQuantity =
    document.getElementById(
      'stockFilterQuantity'
    ).value;

  stockFilterUnit =
    document.getElementById(
      'stockFilterUnit'
    ).value;

  updateStockFilterHint();

  searchProducts(
    document.getElementById('searchInput').value
  );

}


function searchProducts(query) {

  query =
    String(query || '').trim();

  if (!query) {

    renderResults([]);
    return;

  }

  /* Точное совпадение штрихкода. */
  if (products[query]) {

    renderResults(
      applyStockFilter([products[query]])
    );
    return;

  }

  /* Точное совпадение кода 1С. */
  const normalizedCode =
    normalizeCode(query);

  if (normalizedCode) {

    const exactCodeResults = [];
    const keys = Object.keys(products);

    for (let i = 0; i < keys.length; i++) {

      const product = products[keys[i]];

      if (
        normalizeCode(product.code1c) ===
        normalizedCode
      ) {
        exactCodeResults.push(product);
      }

    }

    if (exactCodeResults.length) {

      renderResults(
        applyStockFilter(exactCodeResults).slice(0, 30)
      );
      return;

    }

  }

  /* Поиск по названию. */
  const words =
    query
      .toLowerCase()
      .split(/\s+/)
      .filter(Boolean);

  const results = [];
  const keys = Object.keys(products);

  for (let i = 0; i < keys.length; i++) {

    const product = products[keys[i]];
    const name =
      String(product.name || '').toLowerCase();

    let matches = true;

    for (let j = 0; j < words.length; j++) {

      if (!name.includes(words[j])) {
        matches = false;
        break;
      }

    }

    if (matches) {
      results.push(product);
    }

  }

  renderResults(
    applyStockFilter(results).slice(0, 100)
  );

}

/*
==================================================
ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ
==================================================
*/


function renderResults(results) {

  const container =
    document.getElementById(
      'results'
    );


  container.innerHTML =
    '';


  if (!results.length) {

    if (
      document
        .getElementById(
          'searchInput'
        )
        .value
        .trim()
    ) {

      container.innerHTML =
        '<div class="no-results">' +
        'Ничего не найдено' +
        '</div>';

    }


    return;

  }


  results.forEach(
    function(product) {


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'card';


      const name =
        document.createElement(
          'div'
        );


      name.className =
        'product-name';


      name.textContent =
        product.name ||
        'Без названия';


      const barcode =
        document.createElement(
          'div'
        );


      barcode.className =
        'meta';


      barcode.textContent =
        'Штрихкод: ' +
        (
          product.barcode ||
          '—'
        );


      const code =
        document.createElement(
          'div'
        );


      code.className =
        'meta';


      code.textContent =
        'Код 1С: ' +
        (
          product.code1c ||
          '—'
        );


      const stockLabel =
        document.createElement(
          'div'
        );


      stockLabel.className =
        'stock-label';


      stockLabel.textContent =
        'Доступный остаток';


      const productIsM2 =
        isM2Product(product);


      const stock =
        document.createElement(
          'div'
        );


      stock.className =
        'stock-main';


      if (productIsM2) {

        stock.textContent =
          (product.available || '0') +
          ' шт. / ' +
          (product.availableM2 || '0') +
          ' м²';

      } else {

        stock.textContent =
          (product.available || '0') +
          ' шт.';

      }


      const total =
        document.createElement(
          'div'
        );


      total.className =
        'stock-total';


      if (productIsM2) {

        total.textContent =
          'Остаток: ' +
          (product.stock || '0') +
          ' шт. / ' +
          (product.stockM2 || '0') +
          ' м²';

      } else {

        total.textContent =
          'Остаток: ' +
          (product.stock || '0') +
          ' шт.';

      }


      const price =
        document.createElement(
          'div'
        );


      price.className =
        'price';


      if (productIsM2) {

        price.textContent =
          (product.price || '—') +
          ' ₽/шт.  ·  ' +
          (product.priceM2 || '—') +
          ' ₽/м²';

      } else {

        price.textContent =
          (product.price || '—') +
          ' ₽/шт.';

      }


      const updated =
        document.createElement(
          'div'
        );


      updated.className =
        'meta';


      updated.style.marginTop =
        '10px';


      updated.textContent =
        'Последнее обновление: ' +
        (
          product.updatedAt ||
          '—'
        );


      const nextButton =
        document.createElement(
          'button'
        );


      nextButton.className =
        'button next-button';


      nextButton.textContent =
        'Сканировать следующий';


      nextButton.onclick =
        function() {

          document.getElementById(
            'searchInput'
          ).value =
            '';


          container.innerHTML =
            '';


          document.getElementById(
            'searchInput'
          ).focus();

        };


      card.appendChild(
        name
      );


      card.appendChild(
        barcode
      );


      card.appendChild(
        code
      );


      card.appendChild(
        stockLabel
      );


      card.appendChild(
        stock
      );


      card.appendChild(
        total
      );


      card.appendChild(
        price
      );


      card.appendChild(
        updated
      );


      card.appendChild(
        nextButton
      );


      container.appendChild(
        card
      );

    }
  );

}


/*
==================================================
ПРОВЕРКА НОВОЙ ВЕРСИИ
==================================================
*/


async function checkForNewVersion() {

  if (!databaseData) {

    return;

  }


  try {

    const server =
      await getServerVersion();


    if (
      !server ||
      !server.ok
    ) {

      console.log(
        'Не удалось получить версию сервера'
      );

      return;

    }


    const localVersion =
      Number(
        databaseData.version ||
        0
      );


    const serverVersion =
      Number(
        server.version ||
        0
      );


    console.log(
      'ScanInk:',
      'локальная версия =',
      localVersion,
      'серверная версия =',
      serverVersion
    );


    /*
    База уже актуальна.
    */

    if (
      serverVersion <=
      localVersion
    ) {

      console.log(
        'База актуальна'
      );

      return;

    }


    /*
    Есть новая версия.
    */

    const status =
      document.getElementById(
        'status'
      );


    status.textContent =
      'Доступна новая база. Обновляем...';


    /*
    Скачиваем полную базу
    через fetch.
    */

    const newDatabase =
      await loadDatabaseFromServer();


    const newVersion =
      Number(
        newDatabase.version ||
        0
      );


    /*
    Проверяем, что действительно
    получили новую версию.
    */

    if (
      newVersion <
      serverVersion
    ) {

      throw new Error(
        'Получена старая версия базы'
      );

    }


    /*
    Сначала сохраняем.
    */

    status.textContent =
      'Сохраняем новую базу...';


    await saveDatabase(
      newDatabase
    );


    /*
    Только после успешного сохранения
    переключаем приложение на новую базу.
    */

    setDatabase(
      newDatabase
    );


    status.textContent =
      'База автоматически обновлена';


    setTimeout(
      function() {

        status.textContent =
          '';

      },
      3000
    );


  } catch (error) {

    console.error(
      'Ошибка проверки версии:',
      error
    );


    /*
    Очень важно:

    старая база продолжает работать.

    Пользователь ничего не теряет.
    */

    const status =
      document.getElementById(
        'status'
      );


    status.textContent =
      'Не удалось проверить обновление';


    setTimeout(
      function() {

        status.textContent =
          '';

      },
      3000
    );

  }

}


/*
==================================================
ПРИНУДИТЕЛЬНОЕ ОБНОВЛЕНИЕ
==================================================
*/


async function updateDatabase() {

  const button =
    document.getElementById(
      'updateButton'
    );


  const status =
    document.getElementById(
      'status'
    );


  button.classList.add(
    'loading'
  );


  button.disabled =
    true;


  button.textContent =
    'Обновляем базу...';


  status.textContent =
    'Загружаем актуальную базу...';


  try {

    const data =
      await loadDatabaseFromServer();


    if (
      !data ||
      !data.products
    ) {

      throw new Error(
        'Сервер вернул некорректную базу'
      );

    }


    status.textContent =
      'Сохраняем базу на устройстве...';


    await saveDatabase(
      data
    );


    setDatabase(
      data
    );


    status.textContent =
      'База успешно обновлена';


    setTimeout(
      function() {

        status.textContent =
          '';

      },
      2500
    );


  } catch (error) {

    console.error(
      'Ошибка обновления:',
      error
    );


    status.textContent =
      'Ошибка обновления базы';


  } finally {

    button.classList.remove(
      'loading'
    );


    button.disabled =
      false;


    button.textContent =
      'Обновить базу';

  }

}

function loadScannerLibrary() {

  return new Promise(
    (resolve, reject) => {


      if (
        window.Html5Qrcode
      ) {

        resolve();

        return;

      }


      const script =
        document.createElement(
          'script'
        );


      script.src =
        'https://unpkg.com/html5-qrcode';


      script.onload =
        function() {

          resolve();

        };


      script.onerror =
        function() {

          reject(
            new Error(
              'Не удалось загрузить сканер'
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );

}


async function startCamera() {

  try {

    await loadScannerLibrary();


    document.getElementById(
      'reader'
    ).style.display =
      'block';


    document.getElementById(
      'cameraControls'
    ).style.display =
      'flex';


    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode(
          'reader'
        );

    }


    await html5QrCode.start(

      {
        facingMode:
          'environment'
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 160
        },

        aspectRatio:
          1.777778

      },

      function(decodedText) {


        document.getElementById(
          'searchInput'
        ).value =
          decodedText;


        searchProducts(
          decodedText
        );


        stopCamera();

      },

      function(errorMessage) {

        /*
        Игнорируем ошибки
        отдельных кадров.
        */

      }

    );


    cameraRunning =
      true;


  } catch (error) {

    console.error(
      error
    );


    document.getElementById(
      'status'
    ).textContent =
      'Не удалось открыть камеру';

  }

}


async function stopCamera() {

  if (
    html5QrCode &&
    cameraRunning
  ) {

    try {

      await html5QrCode.stop();

    } catch (e) {

      console.error(
        e
      );

    }

  }


  cameraRunning =
    false;


  document.getElementById(
    'reader'
  ).style.display =
    'none';


  document.getElementById(
    'cameraControls'
  ).style.display =
    'none';

}

/*
==================================================
ЗАПУСК ПРИЛОЖЕНИЯ
==================================================
*/


async function init() {

  const status =
    document.getElementById(
      'status'
    );


  /*
  ================================================
  ПЫТАЕМСЯ ВЗЯТЬ ЛОКАЛЬНУЮ БАЗУ
  ================================================
  */

  try {

    status.textContent =
      'Загружаем базу...';


    const saved =
      await loadDatabaseFromStorage();


    /*
    Локальная база найдена.
    */

    if (
      saved &&
      saved.products
    ) {


      /*
      Показываем её СРАЗУ.

      Никакого ожидания сервера.
      */

      setDatabase(
        saved
      );


      status.textContent =
        '';


      /*
      Проверку новой версии
      запускаем в фоне.
      */

      checkForNewVersion();


      return;

    }

  } catch (error) {

    console.error(
      'Ошибка IndexedDB:',
      error
    );

  }


  /*
  ================================================
  ЛОКАЛЬНОЙ БАЗЫ НЕТ
  ================================================
  */

  status.textContent =
    'Первая загрузка базы...';


  try {

    /*
    Скачиваем полную базу
    */

    const data =
      await loadDatabaseFromServer();


    /*
    Сохраняем её локально
    */

    status.textContent =
      'Сохраняем базу...';


    await saveDatabase(
      data
    );


    /*
    Активируем
    */

    setDatabase(
      data
    );


    status.textContent =
      '';


  } catch (error) {

    console.error(
      'Ошибка первой загрузки:',
      error
    );


    status.textContent =
      'Не удалось загрузить базу';

  }

}


/*
Запускаем приложение.
*/

init();
